<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M4</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:monospace;font-size:10px;}body{background:#090D16;color:#00CCFF;padding:12px;display:flex;justify-content:center;overflow:hidden;}.c{width:100%;max-width:980px;display:flex;flex-direction:column;gap:6px;}.h{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}.b{font-weight:bold;padding:2px 6px;border:1px solid #F05;color:#F05;background:rgba(255,0,85,.05);border-radius:4px;}.b.u{border-color:#0F6;color:#0F6;background:rgba(0,255,102,.05);}.w{width:100%;height:380px;background:#000;border:1px solid #1a2333;border-radius:4px;cursor:grab;}canvas{width:100%;height:100%;display:block;}.p{border:1px solid #1a2333;border-radius:4px;padding:6px;background:rgba(9,13,22,.6);}.p.a{border-color:#00CCFF;background:rgba(0,204,255,.02);}.ph{display:flex;justify-content:space-between;margin-bottom:2px;color:#8ab4f8;}.ps{color:#F05;}.ps.v{color:#0F6;}.g{display:flex;gap:6px;margin-top:2px;}input{background:#000;border:1px solid #00CCFF;color:#0F6;padding:5px;flex-grow:1;border-radius:3px;outline:none;}button{background:rgba(0,204,255,.1);border:1px solid #00CCFF;color:#00CCFF;padding:5px 12px;cursor:pointer;border-radius:3px;}.o{margin-top:4px;color:#0F6;white-space:pre-wrap;display:none;}</style></head><body><div class="c"><div class="h"><div>M4P_ACTIVE_MATRIX</div><div class="b" id="b">ENC_LOCKED</div></div><div class="w" id="wr"><canvas id="cv"></canvas></div><div class="p a"><div class="ph"><span>SYS_VAULT_GATEWAY // TOUCH_VALIDATOR</span><span class="ps" id="gs">[VAULT STATUS] Locked. Enter key.</span></div><div class="g"><input type="password" id="gk" placeholder="AUTH..."><button onclick="auth()">ENTER</button></div></div><div id="q"></div></div><script>
const _X={'A':"-",'B':"--",'C':"---",'E':"-----",'J':"----------",'X':"------------------------------",'Y':"------------------------------------------------------------",'Z':"----------------------------------------------------------------------------------------------------"};
const _L1=_X['A'].length,_L2=_X['B'].length,_L3=_X['C'].length,_L5=_X['E'].length,_L10=_X['J'].length,_L30=_X['X'].length,_L100=_X['Z'].length;

// 📦 POPULATED QUANTUM IMMUNE TELEMETRY MATRIX REGISTER
const M=[102,121,100,114,111,95,109,97,116,114,105,120,37,37,120,100,95,111,98,102,117,115,99,97,116,105,111,110,37,37,100,121,110,97,109,105,99,95,99,97,110,118,97,115,37,37,115,101,99,117,114,105,116,121,95,115,101,97,108];

const TARGET="e929eb14dda6dc481466fec08eda49836c0982a939b7e44a2fc5665013c5627a",NM=["HYDRO_MATRIX","XD_OBFUSCATION","DYNAMIC_CANVAS","SECURITY_SEAL"];
NM.forEach((n,i)=>{document.getElementById("q").innerHTML+=`<div class="p" id="q${i}"><div class="ph"><span>QTR_${i+_L1} // ${n}</span><span class="ps" id="s${i}">[AES-256 VAULT ENCRYPTED]</span></div><div class="o" id="o${i}"></div></div><div style="height:${_L3*_L2}px"></div>`;});

async function auth(){
    const f=document.getElementById("gk"),inp=f.value,nInp=inp.toLowerCase().trim();
    document.getElementById("gs").innerText="[COMPUTING] Stretching key execution vectors...";
    try{
        const te=new TextEncoder();
        let cb=te.encode(nInp),lim=_L100*_L10;
        for(let i=0;i<lim;i++)cb=new Uint8Array(await crypto.subtle.digest('SHA-256',cb));
        const fh=await crypto.subtle.digest('SHA-256',te.encode(nInp)),hex=Array.from(new Uint8Array(fh)).map(b=>b.toString(_L10+_L3+_L3).padStart(_L2,'0')).join('');
        if(hex===TARGET){
            let bo=(_L100*(_L3+_L3))+(_L10*_L5)-_L1,key=nInp.split('').reduce((a,c)=>a+c.charCodeAt(0),0)-bo,res="";
            // Process reverse masking sequence securely
            for(let j=0;j<M.length;j++)res+=String.fromCharCode((j%_L2===0)?(M[j]^key)^0x0F:(M[j]^key)-_L5);
            const split=res.split(String.fromCharCode(_L30+_L5)+String.fromCharCode(_L30+_L5));
            document.getElementById("b").innerText="ENC_UNLOCKED";document.getElementById("b").className="b u";
            document.getElementById("gs").innerText="[SUCCESS] Core interlock accepted.";document.getElementById("gs").className="ps v";
            for(let i=0;i<split.length&&i<NM.length;i++){
                document.getElementById(`q${i}`).className="p a";document.getElementById(`s${i}`).innerText="[DECRYPTED]";
                document.getElementById(`s${i}`).className="ps v";const el=document.getElementById(`o${i}`);el.innerText=split[i].toUpperCase().trim();el.style.display="block";
            }
        }else{document.getElementById("gs").innerText="[FAILED] Signature mismatch.";f.value="";}
    }catch(e){document.getElementById("gs").innerText="[ERROR] Execution exception.";}
}

const c=document.getElementById("cv"),cx=c.getContext("2d"),wr=document.getElementById("wr");let w,h,pts=[],rx=0,ry=0,drag=!1,sx,sy,pTime=0,activeTouches=[],initialPinchDist=0,baseScaleModifier=_L1;
function resize(){const dpr=window.devicePixelRatio||_L1;w=wr.clientWidth;h=wr.clientHeight;c.width=w*dpr;c.height=h*dpr;cx.scale(dpr,dpr);}window.addEventListener("resize",resize);resize();

// 🌌 GENERATE FOUNDATIONAL GEODETIC POINTS FOR VIRTUAL PLATFORM VIEWPORT
const cfg=[[(_L10*_L5),1.5],[(_L100+(_L10*_L5)),3.2],[(_L100*_L3),5.8]];let idx=0;
cfg.forEach(([tot,rad])=>{for(let i=0;i<tot;i++){let ph=(i/tot)*Math.PI*_L2;pts.push({x:Math.cos(ph)*rad*_L10,y:Math.sin(ph)*rad*_L10,z:(i-tot/_L2)*_L2,idx:idx++});}});

function tick(){
    pTime+=0.01;cx.fillStyle="#090D16";cx.fillRect(0,0,w,h);
    let cx1=Math.cos(rx),sx1=Math.sin(rx),cy1=Math.cos(ry),sy1=Math.sin(ry),ox=w/_L2,oy=h/_L2,br=baseScaleModifier*(_L1+Math.sin(pTime)*0.08);
    pts.forEach(p=>{
        if(p.idx%_L2===0){p.x*=0.999;p.y*=0.999;}
        let tx=p.x*br,ty=p.y*br,tz=p.z;
        activeTouches.forEach(t=>{let dx=(tx+ox)-t.x,dy=(ty+oy)-t.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<_L100){let fo=(_L100-dist)/_L100*_L10;tx+=(dx/dist)*fo;ty+=(dy/dist)*fo;}});
        let x1=tx*cy1-tz*sy1,z1=tx*sy1+tz*cy1,y2=ty*cx1-z1*sx1,z2=ty*sx1+z1*cx1,sz=_L100/(_L100+z2),px=ox+x1*sz*_L3,py=oy+y2*sz*_L3;
        if(px>=0&&px<=w&&py>=0&&py<=h){cx.fillStyle=(p.idx%_L2===0)?"#00CCFF":"#F05";cx.fillRect(px,py,_L2,_L2);}
    });
    requestAnimationFrame(tick);
}

function gtp(e){let r=c.getBoundingClientRect();return Array.from(e.touches).map(t=>({x:t.clientX-r.left,y:t.clientY-r.top}));}
wr.addEventListener("touchstart",e=>{e.preventDefault();activeTouches=gtp(e);drag=!0;if(e.touches.length===_L1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else if(e.touches.length===_L2){let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;initialPinchDist=Math.sqrt(dx*dx+dy*dy);}},{passive:false});
wr.addEventListener("touchmove",e=>{e.preventDefault();activeTouches=gtp(e);if(!drag)return;if(e.touches.length===_L1){rx+=(e.touches[0].clientY-sy)*0.008;ry+=(e.touches[0].clientX-sx)*0.008;sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else if(e.touches.length===_L2){let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);if(initialPinchDist>0){baseScaleModifier=Math.max(0.3,Math.min((d/initialPinchDist)*baseScaleModifier,3.0));initialPinchDist=d;}}},{passive:false});
wr.addEventListener("touchend",e=>{e.preventDefault();activeTouches=gtp(e);if(e.touches.length===0){drag=!1;initialPinchDist=0;}},{passive:false});
wr.addEventListener("mousedown",e=>{drag=!0;sx=e.clientX;sy=e.clientY;activeTouches=[{x:e.clientX-c.getBoundingClientRect().left,y:e.clientY-c.getBoundingClientRect().top}];});window.addEventListener("mouseup",()=>{drag=!1;activeTouches=[];});window.addEventListener("mousemove",e=>{let r=c.getBoundingClientRect();if(!drag){activeTouches=[];return;}activeTouches=[{x:e.clientX-r.left,y:e.clientY-r.top}];rx+=(e.clientY-sy)*0.008;ry+=(e.clientX-sx)*0.008;sx=e.clientX;sy=e.clientY;});tick();
</script></body></html>
