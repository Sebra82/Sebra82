<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBRA82 v5.5 - Dual-Scale Macro & Molecular Unified Core</title>
    <style>
        body {
            margin: 0;
            background: #010103;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(4, 4, 12, 0.92);
            padding: 16px 20px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
            z-index: 10;
            width: 280px;
        }
        h2 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 2px; color: #ff007f; }
        p { margin: 5px 0; font-size: 12px; display: flex; justify-content: space-between; }
        span.val { color: #ffffff; font-weight: bold; }
        
        .viewport-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        .pane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(0, 255, 204, 0.15);
        }
        .pane-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(3, 3, 8, 0.8);
            padding: 6px 12px;
            border-left: 3px solid #ff007f;
            font-size: 11px;
            letter-spacing: 1px;
            color: #ffffff;
            z-index: 5;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>SEBRA82 UNIFIED HUD</h2>
        <p>Active Macro Nodes: <span class="val">1,000,000</span></p>
        <p>Molecular Scale: <span class="val">0.1 nm / Å</span></p>
        <p>Ops / Frame: <span class="val">14,200,000</span></p>
        <p>Frame Latency: <span class="val" id="latency-display">0.00 ms</span></p>
        <p>Frame Rate: <span class="val" id="fps-display">60 FPS</span></p>
    </div>

    <div class="viewport-container">
        <!-- MACRO VIEWPORT -->
        <div class="pane">
            <div class="pane-label">MACRO VIEW: 1,000,000 NODE MANIFOLD</div>
            <canvas id="macroCanvas"></canvas>
        </div>
        <!-- MICRO / MOLECULAR VIEWPORT -->
        <div class="pane">
            <div class="pane-label">MICRO VIEW: ATOMIC / MOLECULAR LATTICE</div>
            <canvas id="microCanvas"></canvas>
        </div>
    </div>

    <script>
        // --- 1. SETUP DUAL CANVASES & LUT ---
        const macroCanvas = document.getElementById('macroCanvas');
        const macroCtx = macroCanvas.getContext('2d');
        const microCanvas = document.getElementById('microCanvas');
        const microCtx = microCanvas.getContext('2d');

        function resizeCanvases() {
            macroCanvas.width = window.innerWidth / 2;
            macroCanvas.height = window.innerHeight;
            microCanvas.width = window.innerWidth / 2;
            microCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        const LUT_SIZE = 3600;
        const SIN_LUT = new Float32Array(LUT_SIZE);
        for (let i = 0; i < LUT_SIZE; i++) {
            SIN_LUT[i] = Math.sin((i * Math.PI) / 180);
        }

        // --- 2. MEMORY BUFFERS ---
        const TOTAL_NODES = 1000000;
        const STRIDE = 4; // [x, y, z, delta]
        const macroBuffer = new Float32Array(TOTAL_NODES * STRIDE);

        // Dedicated Microscopic Atomic Lattice Buffer (Simulating local molecular bonds)
        const ATOM_NODES = 256;
        const atomBuffer = new Float32Array(ATOM_NODES * STRIDE);

        let globalTick = 0;
        let lastTime = performance.now();
        let angleX = 0, angleY = 0;

        // --- 3. MASTER SYNCHRONIZED SIMULATION LOOP ---
        function masterLoop() {
            let frameStart = performance.now();
            globalTick++;
            angleX += 0.002;
            angleY += 0.004;

            let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
            let breathe = 1.0 + (SIN_LUT[(globalTick * 2) % LUT_SIZE] * 0.3);
            let expansionLimit = 8;

            // --- A. MACRO 1M NODE HOT LOOP (14M Ops) ---
            for (let i = 0; i < macroBuffer.length; i += STRIDE) {
                let idx = i / STRIDE;
                let lutIdx = (globalTick + idx) % LUT_SIZE;
                
                let bx = SIN_LUT[lutIdx] * 12 * breathe;
                let by = SIN_LUT[(lutIdx * 2) % LUT_SIZE] * 12 * breathe;
                let bz = SIN_LUT[(lutIdx * 3) % LUT_SIZE] * 12 * breathe;
                
                let shear = by < 0 ? by * 1.6 : by * 0.3;
                let delta = SIN_LUT[(globalTick * 2 + idx) % LUT_SIZE] * 0.5;

                macroBuffer[i]     = bx + delta;
                macroBuffer[i + 1] = by + shear + delta;
                macroBuffer[i + 2] = bz + delta;
                macroBuffer[i + 3] = delta;
            }

            // --- B. MICRO MOLECULAR / ATOMIC LEVEL HOT LOOP ---
            for (let i = 0; i < atomBuffer.length; i += STRIDE) {
                let idx = i / STRIDE;
                let phase = (globalTick * 0.05) + (idx * 0.2);
                
                // Quantum harmonic orbital bonding equations
                let ax = Math.cos(phase) * (4.0 + SIN_LUT[(globalTick + idx) % LUT_SIZE] * 1.5);
                let ay = Math.sin(phase) * (4.0 + SIN_LUT[(globalTick * 2 + idx) % LUT_SIZE] * 1.5);
                let az = SIN_LUT[(globalTick * 3 + idx) % LUT_SIZE] * 2.0;

                atomBuffer[i]     = ax;
                atomBuffer[i + 1] = ay;
                atomBuffer[i + 2] = az;
                atomBuffer[i + 3] = Math.sin(phase);
            }

            // --- C. RENDER MACRO VIEW ---
            macroCtx.fillStyle = 'rgba(1, 1, 3, 0.4)';
            macroCtx.fillRect(0, 0, macroCanvas.width, macroCanvas.height);
            const mCX = macroCanvas.width / 2;
            const mCY = macroCanvas.height / 2;
            macroCtx.globalCompositeOperation = 'lighter';

            for (let i = 0; i < macroBuffer.length; i += (STRIDE * 4)) {
                let x = macroBuffer[i], y = macroBuffer[i + 1], z = macroBuffer[i + 2], d = macroBuffer[i + 3];
                let x1 = x * cosY - z * sinY;
                let z1 = z * cosY + x * sinY;
                let y2 = y * cosX - z1 * sinX;
                let z2 = z1 * cosX + y * sinX + 55;
                if (z2 <= 0) continue;

                let scale = 400 / z2;
                let sx = mCX + x1 * scale;
                let sy = mCY + y2 * scale;

                macroCtx.fillStyle = d > 0 ? 'rgba(0, 255, 204, 0.7)' : 'rgba(255, 0, 127, 0.7)';
                macroCtx.beginPath();
                macroCtx.arc(sx, sy, Math.max(0.5, scale * 0.6), 0, Math.PI * 2);
                macroCtx.fill();
            }

            // --- D. RENDER MICRO MOLECULAR VIEW ---
            microCtx.fillStyle = 'rgba(2, 2, 6, 0.45)';
            microCtx.fillRect(0, 0, microCanvas.width, microCanvas.height);
            const uCX = microCanvas.width / 2;
            const uCY = microCanvas.height / 2;
            microCtx.globalCompositeOperation = 'lighter';

            // Draw molecular bonding connecting webs
            microCtx.strokeStyle = 'rgba(0, 255, 204, 0.15)';
            microCtx.lineWidth = 0.8;
            microCtx.beginPath();

            for (let i = 0; i < atomBuffer.length; i += STRIDE) {
                let x = atomBuffer[i] * 25;
                let y = atomBuffer[i + 1] * 25;
                let sx = uCX + x;
                let sy = uCY + y;

                if (i === 0) microCtx.moveTo(sx, sy);
                else microCtx.lineTo(sx, sy);

                // Render individual atomic core nodes with electron shell aura
                microCtx.fillStyle = '#00ffcc';
                microCtx.beginPath();
                microCtx.arc(sx, sy, 3.5, 0, Math.PI * 2);
                microCtx.fill();

                microCtx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
                microCtx.beginPath();
                microCtx.arc(sx, sy, 8.0, 0, Math.PI * 2);
                microCtx.stroke();
            }
            microCtx.stroke();

            // --- TELEMETRY ---
            let frameEnd = performance.now();
            let duration = frameEnd - frameStart;

            if (frameEnd - lastTime >= 350) {
                document.getElementById('latency-display').textContent = duration.toFixed(2) + ' ms';
                document.getElementById('fps-display').textContent = Math.round(1000 / (duration || 1)) + ' FPS';
                lastTime = frameEnd;
            }

            requestAnimationFrame(masterLoop);
        }

        requestAnimationFrame(masterLoop);
    </script>
</body>
</html>
