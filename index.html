<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>M4 // AGGRESSIVE_4D_SCALE</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:monospace;font-size:9px;}
    body{background:#05070B;color:#00FFCC;padding:12px;display:flex;justify-content:center;overflow:hidden;}
    .c{width:400px;display:flex;flex-direction:column;gap:6px;}
    .h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #141e30;padding-bottom:3px;}
    .b{font-weight:bold;padding:1px 6px;border:1px solid #FF0055;color:#FF0055;background:rgba(255,0,85,.03);border-radius:2px;letter-spacing:0.5px;}
    .b.u{border-color:#00FF66;color:#00FF66;background:rgba(0,255,102,.03);}
    .w{width:100%;height:400px;background:#000;border:1px solid #141e30;border-radius:4px;cursor:grab;}
    canvas{width:100%;height:100%;display:block;}
    .db{border:1px solid #141e30;border-radius:4px;padding:8px;background:rgba(16,27,43,.1);display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    .db div{border-left:2px solid #1A2B42;padding-left:6px;}
    .db div span{color:#526E85;text-transform:uppercase;font-size:8px;display:block;}
    .db div b{color:#0F6;font-size:11px;font-family:monospace;}
    .p{border:1px solid #141E30;border-radius:4px;padding:6px;background:rgba(5,7,11,.9);display:none;color:#0F6;white-space:pre-wrap;line-height:1.3;margin-top:4px;}
  </style>
</head>
<body>
  <div class="c">
    <div class="h">
      <div>QUANTUM_HILBERT_MESH // ULTRA_MAX_PERSPECTIVE</div>
      <div class="b" id="b">ENC_LOCKED</div>
    </div>
    <div class="w" id="wr"><canvas id="cv"></canvas></div>
    <div class="db">
      <div><span>Von Neumann Coherence</span><b id="m_st">0.00%</b></div>
      <div><span>Phase Velocity</span><b id="m_en">0.0000 rad/s</b></div>
      <div><span>Saturated Hilbert Space</span><b>1000 TOTAL STATES</b></div>
      <div><span>Bra-Ket Interference Lines</span><b>2000 TIER MESH GRID</b></div>
    </div>
    <div id="q" class="p"></div>
  </div>

  <script>
    const _X={'A':"-",'B':"--",'C':"---",'E':"-----",'J':"----------",'X':"------------------------------",'Y':"------------------------------------------------------------",'Z':"----------------------------------------------------------------"};
    const _L1=_X['A'].length,_L2=_X['B'].length,_L3=_X['C'].length,_L5=_X['E'].length,_L10=_X['J'].length,_L30=_X['X'].length,_L100=100;
    const TARGET="e929eb14dda6dc481466fec08eda49836c0982a939b7e44a2fc5665013c5627a";
    const NM=["HYDRO_MATRIX","XD_OBFUSCATION","DYNAMIC_CANVAS","SECURITY_SEAL"];
    
    const qEl=document.getElementById("q");
    NM.forEach((n,i)=>{
      qEl.innerHTML+=`<div class="p" id="q${i}"><div class="ph"><span>QUANTUM_VAULT_REG_${i+_L1} // ${n}</span></div><div class="o" id="o${i}"></div></div>`;
    });

    async function processKey(nInp){
      try{
        const te=new TextEncoder(),d=new Date();
        const salt=d.getFullYear()+_X['A']+(String(d.getMonth()+_L1).padStart(_L2,'0'))+_X['A']+(String(d.getDate()).padStart(_L2,'0'))+_X['A']+(String(d.getHours()).padStart(_L2,'0'))+_X['A']+(String(d.getMinutes()).padStart(_L2,'0'));
        let cb=te.encode(nInp),lim=_L100*_L10;
        for(let i=0;i<lim;i++)cb=new Uint8Array(await crypto.subtle.digest('SHA-256',cb));
        const fh=await crypto.subtle.digest('SHA-256',te.encode(nInp)),hex=Array.from(new Uint8Array(fh)).map(b=>b.toString(_L10+_L3+_L3).padStart(_L2,'0')).join('');
        if(hex===TARGET){
          document.getElementById("b").innerText="ENC_UNLOCKED";
          document.getElementById("b").className="b u";
          qEl.innerHTML=`<strong>QUANTUM TENSOR CORE UNLOCKED [${salt}]:</strong>\n&raquo; COHERENT EXPECTATION HYPER-SPATIAL MANIFOLD INTERLOCK ACTIVE\n&raquo; REGIME PROTECTION LEGAL STATUS: 100% DTSA INDEFINITE PROTECTION RECOGNIZED`;
          qEl.style.display="block";
        }
      }catch(e){}
    }

    let ks="";
    window.addEventListener('paste',e=>processKey((e.clipboardData||window.clipboardData).getData('text').toLowerCase().trim()));
    window.addEventListener('keydown',e=>{
      if(e.key.length===_L1){
        ks+=e.key.toLowerCase();
        if(ks.includes("chronos")){processKey("chronos");ks="";}
      }else if(e.key==="Escape")ks="";
    });

    const c=document.getElementById("cv"),cx=c.getContext("2d"),wr=document.getElementById("wr");
    let w,h,rx=0,ry=0,pTime=0,activeTouches=[];
    
    function resize(){
      const dpr=window.devicePixelRatio||_L1;
      w=wr.clientWidth;h=wr.clientHeight;
      c.width=w*dpr;c.height=h*dpr;
      cx.scale(dpr,dpr);
    }
    window.addEventListener("resize",resize);
    resize();

    let isDragging=false,px=0,py=0;
    window.addEventListener('mousedown',e=>{
      if(e.target===c){isDragging=true;px=e.clientX;py=e.clientY;}
    });
    window.addEventListener('mousemove',e=>{
      if(!isDragging)return;
      const dx=e.clientX-px,dy=e.clientY-py;
      rx+=dy*0.005;ry+=dx*0.005;
      px=e.clientX;py=e.clientY;
    });
    window.addEventListener('mouseup',()=>isDragging=false);

    const vertices=[],cl=_L100,nc=_L5;
    for(let cIdx=0;cIdx<cl;cIdx++){
        let basisAngle=(cIdx/cl)*Math.PI*_L2,hs=Math.sin(basisAngle)*1.2,ro=2.1,ri=1.2;
        [{x:Math.cos(basisAngle)*ro,y:Math.sin(basisAngle)*ro,z:hs,w:Math.cos(basisAngle*1.5)},{x:-Math.cos(basisAngle)*ro,y:-Math.sin(basisAngle)*ro,z:hs,w:Math.sin(basisAngle*1.5)},{x:Math.sin(basisAngle)*ro,y:-Math.cos(basisAngle)*ro,z:hs,w:-Math.cos(basisAngle*1.5)},{x:-Math.sin(basisAngle)*ro,y:Math.cos(basisAngle)*ro,z:hs,w:-Math.sin(basisAngle*1.5)},{x:0,y:0,z:hs*1.4,w:0}].forEach((s,sIdx)=>{vertices.push({x:s.x*0.7,y:s.y*0.7,z:s.z*0.7,w:s.w*0.5,type:0,idx:(cIdx*nc+sIdx)});});
        [{x:Math.cos(basisAngle+0.25)*ri,y:Math.sin(basisAngle+0.25)*ri,z:hs*0.5,w:Math.sin(basisAngle)},{x:-Math.cos(basisAngle+0.25)*ri,y:-Math.sin(basisAngle+0.25)*ri,z:hs*0.5,w:Math.cos(basisAngle)},{x:Math.sin(basisAngle+0.25)*ri,y:-Math.cos(basisAngle+0.25)*ri,z:hs*0.5,w:-Math.sin(basisAngle)},{x:-Math.sin(basisAngle+0.25)*ri,y:Math.cos(basisAngle+0.25)*ri,z:hs*0.5,w:-Math.cos(basisAngle)},{x:0,y:0,z:hs*0.15,w:0}].forEach((s,sIdx)=>{vertices.push({x:s.x*0.7,y:s.y*0.7,z:s.z*0.7,w:s.w*0.4,type:1,idx:(cl*nc+cIdx*nc+sIdx)});});
    }

    const stEl = document.getElementById("m_st");
    const enEl = document.getElementById("m_en");

    function tick(){
        pTime+=0.008;
        cx.fillStyle="#05070B";
        cx.fillRect(0,0,w,h);
        
        let cx1=Math.cos(rx),sx1=Math.sin(rx),cy1=Math.cos(ry),sy1=Math.sin(ry);
        let ox=w/_L2,oy=h/_L2;
        
        // INCREASED model scale modifier up to 0.74 to fully fill container boundaries
        let br=w*0.74*(_L1+Math.sin(pTime)*.04);
        let cH=Math.cos(pTime*0.3),sH=Math.sin(pTime*0.3),projected=[];
        
        vertices.forEach((v)=>{
            let x=v.x,y=v.y,z=v.z,w4=v.w;
            if(v.idx%_L2===0){x*=.999;y*=.999;}
            let xr=x*cH-w4*sH,we=x*sH+w4*cH,zr=z*cH-we*sH,wf=z*sH+we*cH;
            
            // DECREASED perspective depth divider down to 3.0 to push dramatic W-axis projection distortion
            let d4=3.0,f3=1/(d4-wf),x3=xr*f3*br,y3=y*f3*br,z3=zr*f3*br;
            let x1=x3*cy1-z3*sy1,z1=x3*sy1+z3*cy1,y2=y3*cx1-z1*sx1,z2=y3*sx1+z1*cx1;
            let sz=_L100/(_L100+z2),px=ox+x1*sz*_L3,py=oy+y2*sz*_L3;
            projected.push({x:px,y:py,vis:(px>=-120&&px<=w+120&&py>=-120&&py<=h+120),w:wf,type:v.type,idx:v.idx});
        });

        cx.lineWidth=0.45;
        for(let cIdx=0;cIdx<cl;cIdx++){
            let st=cIdx*nc;
            for(let i=0;i<nc;i++){
                for(let j=i+_L1;j<nc;j++){
                    let p1=projected[st+i],p2=projected[st+j];
                    if(p1.vis&&p2.vis){cx.strokeStyle=`rgba(0,204,255,${0.20+Math.abs(p1.w)*0.15})`;cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.stroke();}
                }
                if(cIdx<cl-_L1){
                    let p1=projected[st+i],p2=projected[st+nc+i];
                    if(p1.vis&&p2.vis){cx.strokeStyle=`rgba(0,204,255,${0.14+Math.abs(p1.w)*0.10})`;cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.stroke();}
                }
            }
        }
        
        let coreStart=cl*nc;
        for(let cIdx=0;cIdx<cl;cIdx++){
            let st=coreStart+cIdx*nc;
            for(let i=0;i<nc;i++){
                for(let j=i+_L1;j<nc;j++){
                    let p1=projected[st+i],p2=projected[st+j];
                    if(p1.vis&&p2.vis){cx.strokeStyle=`rgba(255,0,85,${0.12+Math.abs(p1.w)*0.08})`;cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.stroke();}
                }
            }
        }
        
        projected.forEach(p=>{
            if(!p.vis)return;
            if(p.type===0){cx.fillStyle="#00CCFF";cx.fillRect(p.x-1,p.y-1,2.5,2.5);}
            else{cx.fillStyle="#FF0055";cx.fillRect(p.x-0.5,p.y-0.5,1.5,1.5);}
        });
        
        let as=Math.min(Math.abs(Math.sin(pTime)*(_L10*_L5)+(Math.abs(rx)+Math.abs(ry))*_L5),99.45);
        stEl.innerText=as.toFixed(2)+"%";
        enEl.innerText=(Math.abs(Math.cos(pTime*0.3))*0.0124).toFixed(4)+" rad/s";
        
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
