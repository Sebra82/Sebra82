<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebra82 // Quantum Atto-Console</title>
    <style>
        :root {
            --bg: #000;
            --pnl: rgba(2,4,6,0.99);
            --brd: #020508;
            --cyn: #00f3ff;
            --grn: #00ff66;
            --mtd: #141a22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; line-height: 1; font-size: 0.38rem; }

        body {
            background: var(--bg);
            color: #38414a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            padding: 1px;
        }

        .dashboard-frame {
            width: 100%;
            max-width: 110px;
            display: flex;
            flex-direction: column;
            gap: 1.5px;
        }

        .sys-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .header-tag { 
            color: var(--cyn); 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 80%;
        }

        .visualizer-container {
            width: 100%;
            height: 25px;
            background: #000;
            border: 1px solid var(--brd);
            position: relative;
        }
        #constellationCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
        }

        .metrics-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--pnl);
            border: 1px solid var(--brd);
            padding: 1px;
        }
        .metric-item { display: flex; flex-direction: column; cursor: pointer; }
        .m-lbl { font-size: 0.34rem; color: var(--mtd); font-weight: bold; letter-spacing: -0.2px; }
        .m-val { font-weight: bold; font-variant-numeric: tabular-nums; }

        .pipeline-card {
            background: var(--pnl);
            border: 1px solid var(--brd);
            padding: 1px 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .hl-cyn { color: var(--cyn); }
        .hl-grn { color: var(--grn); }
    </style>
</head>
<body>

    <div class="dashboard-frame">
        <div class="sys-header">
            <span class="header-tag" id="mainHeader" onclick="scrambleHeader()">M4P//6.99</span>
            <span class="hl-grn">ON</span>
        </div>

        <div class="visualizer-container">
            <canvas id="constellationCanvas"></canvas>
        </div>

        <div class="metrics-block">
            <div class="metric-item" onclick="spinEntropy()">
                <span class="m-lbl">ENTR</span>
                <span class="m-val hl-grn" id="entropyVal">.962</span>
            </div>
            <div class="metric-item" onclick="spinPhase()">
                <span class="m-lbl">PHAS</span>
                <span class="m-val hl-grn" id="phaseVal">.004</span>
            </div>
            <div class="metric-item" onclick="scrambleSubspace()">
                <span class="m-lbl">HILB</span>
                <span class="m-val hl-cyn" id="subspaceVal">2⁵⁰⁰</span>
            </div>
            <div class="metric-item" onclick="scrambleMesh()">
                <span class="m-lbl">MESH</span>
                <span class="m-val hl-cyn" id="meshSyncText">SYNC</span>
            </div>
        </div>

        <div class="pipeline-card" onclick="scramblePipe(1)">
            <span class="hl-cyn" id="pipeLabel1">Q1//HYD</span>
            <span class="hl-grn" id="pipeStatus1">OK</span>
        </div>
        <div class="pipeline-card" onclick="scramblePipe(2)">
            <span class="hl-cyn" id="pipeLabel2">Q2//XD</span>
            <span class="hl-grn" id="pipeStatus2">OK</span>
        </div>
    </div>

    <script>
        const SYSTEM_STATE = Object.freeze({
            headerVal: 'M4P//6.99', entropyVal: '.962', phaseVal: '.004',
            subspaceVal: '2⁵⁰⁰', meshVal: 'SYNC', pipe1Val: 'Q1//HYD', pipe2Val: 'Q2//XD',
            matrixChars: "ΨΩαβX01%"
        });

        const activeLoops = new Map();
        const canvas = document.getElementById('constellationCanvas');
        const ctx = canvas?.getContext('2d');
        let nodes = [], angleX = 0, angleY = 0;

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            initConstellation();
        }

        function initConstellation() {
            nodes = [];
            const count = 18; 
            for (let i = 0; i < count; i++) {
                const theta = (i / count) * Math.PI * 4;
                const r = 0.6 * (Math.sin(i * 0.05) + 0.6);
                nodes.push({ x: Math.cos(theta) * r, y: (i / count) * 1.6 - 0.8, z: Math.sin(theta) * r, color: i % 2 === 0 ? '#ff0055' : '#00f3ff' });
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateConstellation() {
            if (!ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height / 2, projected = [];

            nodes.forEach(n => {
                let x1 = n.x * Math.cos(angleY) - n.z * Math.sin(angleY);
                let z1 = n.x * Math.sin(angleY) + n.z * Math.cos(angleY);
                let y2 = n.y * Math.cos(angleX) - z1 * Math.sin(angleX);
                let z2 = n.y * Math.sin(angleX) + z1 * Math.cos(angleX);
                projected.push({ x: cx + x1 * (22 / (2.2 - z2)), y: cy + y2 * (22 / (2.2 - z2)), z: z2, color: n.color });
            });

            ctx.lineWidth = 0.15;
            for (let i = 0; i < projected.length; i++) {
                for (let j = i + 1; j < Math.min(i + 2, projected.length); j++) {
                    if (Math.hypot(projected[i].x - projected[j].x, projected[i].y - projected[j].y) < 7) {
                        ctx.strokeStyle = projected[i].color === '#ff0055' ? 'rgba(255,0,85,0.04)' : 'rgba(0,243,255,0.04)';
                        ctx.beginPath(); ctx.moveTo(projected[i].x, projected[i].y); ctx.lineTo(projected[j].x, projected[j].y); ctx.stroke();
                    }
                }
            }

            projected.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.2, (2.2 - p.z) * 0.2), 0, Math.PI * 2); ctx.fill();
            });

            angleX += 0.002; angleY += 0.004;
            requestAnimationFrame(animateConstellation);
        }
        animateConstellation();

        function clearLoop(key) { if (activeLoops.has(key)) { clearInterval(activeLoops.get(key)); activeLoops.delete(key); } }

        function scrambleText(elementId, original) {
            const el = document.getElementById(elementId); if (!el) return;
            clearLoop(elementId);
            let steps = 0, maxSteps = 6;
            const interval = setInterval(() => {
                el.innerText = original.split("").map((c, i) => (i < (steps / maxSteps) * original.length || c === "/") ? c : SYSTEM_STATE.matrixChars[Math.floor(Math.random() * SYSTEM_STATE.matrixChars.length)]).join("");
                if (++steps >= maxSteps) { clearInterval(interval); activeLoops.delete(elementId); el.innerText = original; }
            }, 40);
            activeLoops.set(elementId, interval);
        }

        function scrambleHeader() { scrambleText('mainHeader', SYSTEM_STATE.headerVal); }
        function scrambleMesh() { scrambleText('meshSyncText', SYSTEM_STATE.meshVal); }
        function scramblePipe(id) { 
            scrambleText(`pipeLabel${id}`, SYSTEM_STATE[`pipe${id}Val`]);
            const s = document.getElementById(`pipeStatus${id}`); if(!s) return;
            s.innerText = "FX"; s.className = "hl-cyn";
            setTimeout(() => { s.innerText = "OK"; s.className = "hl-grn"; }, 240);
        }

        function manipulateNumbers(elementId, generateFunc, finalVal) {
            const el = document.getElementById(elementId); if (!el) return;
            clearLoop(elementId);
            let d = 0;
            const interval = setInterval(() => { el.innerText = generateFunc(); if ((d += 40) > 240) { clearInterval(interval); activeLoops.delete(elementId); el.innerText = finalVal; } }, 40);
            activeLoops.set(elementId, interval);
        }

        function spinEntropy() { manipulateNumbers('entropyVal', () => (Math.random() * 0.9).toFixed(3).substring(1), SYSTEM_STATE.entropyVal); }
        function spinPhase() { manipulateNumbers('phaseVal', () => (Math.random() * 0.009).toFixed(3).substring(1), SYSTEM_STATE.phaseVal); }
        function scrambleSubspace() { manipulateNumbers('subspaceVal', () => `2⁵${Math.floor(Math.random() * 9)}`, SYSTEM_STATE.subspaceVal); }
    </script>
</body>
</html>
