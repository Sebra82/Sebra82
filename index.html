<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantEngine SaaS — Quantum Model Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX Compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #02040a;
      color: #f1f5f9;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden antialiased select-none p-3">

  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function QuantumCanvas({ theta, phi, isRunning }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let t = 0;

        const render = () => {
          t += isRunning ? 0.08 : 0.02;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const width = canvas.width;
          const height = canvas.height;
          const centerY = height / 2;

          // Draw animated quantum wave superposition
          ctx.beginPath();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#00F2FE';

          for (let x = 0; x < width; x++) {
            const amplitude = Math.sin(theta) * 20 + 5;
            const frequency = 0.03 + phi * 0.01;
            const y = centerY + Math.sin(x * frequency + t) * amplitude * Math.cos(x * 0.01 + t * 0.5);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Second phase wave (Violet)
          ctx.beginPath();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#A855F7';
          for (let x = 0; x < width; x++) {
            const amplitude = Math.cos(theta) * 18 + 5;
            const frequency = 0.025;
            const y = centerY + Math.cos(x * frequency - t * 1.2) * amplitude;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => cancelAnimationFrame(animationFrameId);
      }, [theta, phi, isRunning]);

      return <canvas ref={canvasRef} width={400} height={80} className="w-full h-20 rounded bg-slate-950/80 border border-slate-800" />;
    }

    function QuantEnginePortal() {
      const [qubits, setQubits] = useState(64);
      const [theta, setTheta] = useState(0.41);
      const [phi, setPhi] = useState(0.85);
      const [isRunning, setIsRunning] = useState(false);
      const [activeStep, setActiveStep] = useState(1);
      const [calcPulse, setCalcPulse] = useState(0);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeStep, isRunning]);

      // Moving dynamic pulse counter
      useEffect(() => {
        const interval = setInterval(() => {
          setCalcPulse((prev) => (prev + 1) % 100);
        }, 80);
        return () => clearInterval(interval);
      }, []);

      const totalStates = Math.pow(2, qubits);
      const formattedStates = totalStates > 1e12 
        ? (totalStates / 1e18).toFixed(1) + ' Quintillion' 
        : totalStates.toLocaleString();

      const dynamicPhaseShift = (phi + calcPulse * 0.005).toFixed(2);
      const c00 = Math.cos(theta / 2).toFixed(3);
      const c01 = Math.sin(theta / 2).toFixed(3);

      const p00 = Math.round(Math.pow(Math.cos(theta / 2), 2) * 100);
      const p01 = Math.round(Math.pow(Math.sin(theta / 2), 2) * 100);

      const applyPreset = (q, t, p) => {
        setQubits(q);
        setTheta(t);
        setPhi(p);
      };

      const handleRunModel = () => {
        setIsRunning(true);
        setActiveStep(1);
        setTimeout(() => setActiveStep(2), 200);
        setTimeout(() => setActiveStep(3), 400);
        setTimeout(() => setActiveStep(4), 600);
        setTimeout(() => setIsRunning(false), 800);
      };

      return (
        <div className="h-full w-full flex flex-col justify-between gap-2 max-w-7xl mx-auto">
          
          {/* Header */}
          <header className="flex items-center justify-between bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-lg text-xs">
            <div className="flex items-center gap-2">
              <div className="p-1.5 bg-cyan-500/10 border border-cyan-500/30 rounded">
                <i data-lucide="zap" className="w-4 h-4 text-cyan-400"></i>
              </div>
              <div>
                <span className="font-bold text-white mr-2">QuantEngine SaaS</span>
                <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">
                  PRO NODE • UK CENTRAL
                </span>
              </div>
            </div>

            <div className="flex items-center gap-4 text-slate-400 font-mono text-[11px]">
              <span>Q-Credits: <strong className="text-cyan-400">4,850</strong></span>
              <span>Model Speedup: <strong className="text-emerald-400">422.5M x</strong></span>
              <span>Constant Latency: <strong className="text-emerald-400">31ms</strong></span>
            </div>
          </header>

          {/* Top Presets */}
          <div className="flex items-center gap-2 text-[11px]">
            <span className="text-slate-500 font-semibold uppercase text-[10px]">Presets:</span>
            <button onClick={() => applyPreset(64, 0.41, 0.85)} className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">
              📈 Financial Risk
            </button>
            <button onClick={() => applyPreset(32, 1.12, 1.57)} className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">
              🧬 Molecular State
            </button>
            <button onClick={() => applyPreset(48, 0.78, 2.30)} className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">
              🚚 Logistics Network
            </button>
          </div>

          {/* Animated Quantum Wave Canvas */}
          <div className="bg-slate-900/50 border border-slate-800 rounded-lg p-2.5">
            <div className="flex justify-between items-center mb-1 text-[11px]">
              <span className="text-slate-400 font-mono flex items-center gap-1.5">
                <i data-lucide="activity" className="w-3.5 h-3.5 text-cyan-400"></i> 
                Live Statewave Animation
              </span>
              <span className="text-cyan-400 font-mono text-[10px]">
                Phase Shift: e^(i{dynamicPhaseShift})
              </span>
            </div>
            <QuantumCanvas theta={theta} phi={phi} isRunning={isRunning} />
          </div>

          {/* Main Dual Engine Stage */}
          <div className="grid grid-cols-2 gap-3 flex-1 min-h-0">
            
            {/* Classical CPU */}
            <div className="bg-rose-950/20 border border-rose-900/40 rounded-lg p-3 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-2 text-xs">
                  <span className="font-bold text-rose-300 flex items-center gap-1">
                    <i data-lucide="cpu" className="w-4 h-4 text-rose-500"></i> Classical Standard CPU
                  </span>
                  <span className="text-[10px] font-mono text-rose-400 bg-rose-500/10 border border-rose-500/30 px-1.5 py-0.5 rounded">
                    TIMEOUT
                  </span>
                </div>

                <div className="space-y-2 text-[11px] font-mono">
                  <div className="p-2 bg-slate-950/80 rounded border border-rose-900/30">
                    <div className="text-slate-500 text-[10px]">Loop Saturation:</div>
                    <div className="text-rose-400 font-bold">Serial Matrix Inversion</div>
                    <div className="text-slate-400 text-[10px]">Iter: {(calcPulse * 1024).toLocaleString()} / {formattedStates}</div>
                  </div>

                  <div className="p-2 bg-slate-950/60 rounded border border-slate-800">
                    <span className="text-slate-400 block text-[10px]">Est. Completion:</span>
                    <span className="text-base font-bold text-rose-400">~15.2 Days</span>
                  </div>
                </div>
              </div>

              <div className="text-[10px] font-mono text-slate-500 border-t border-rose-900/20 pt-1.5">
                Thread Load: 100% Core Pinned
              </div>
            </div>

            {/* Quantum Model Engine */}
            <div className="bg-cyan-950/20 border border-cyan-500/40 rounded-lg p-3 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-2 text-xs">
                  <span className="font-bold text-cyan-200 flex items-center gap-1">
                    <i data-lucide="zap" className="w-4 h-4 text-cyan-400"></i> Quantum Model Core
                  </span>
                  <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-1.5 py-0.5 rounded">
                    COMPLETE (31ms)
                  </span>
                </div>

                {/* Dynamic Calculation Box */}
                <div className="space-y-2 text-[11px]">
                  <div className="p-2 bg-slate-950/90 rounded border border-cyan-500/30 font-mono">
                    <div className="text-slate-400 text-[10px] mb-0.5">Moving State Calculation |Ψ⟩:</div>
                    <div className="text-amber-300 font-bold text-xs">
                      {c00}|00⟩ + {c01}|01⟩ + e^(i{dynamicPhaseShift})0.11|10⟩
                    </div>
                    <div className="text-slate-400 text-[10px] mt-1 flex justify-between border-t border-slate-800/80 pt-1">
                      <span>c00 = cos(θ/2) = {c00}</span>
                      <span>c01 = sin(θ/2) = {c01}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-[11px]">
                    <div className="p-2 bg-slate-950/60 rounded border border-slate-800">
                      <span className="text-slate-400 block text-[10px]">Ground |00⟩:</span>
                      <div className="w-full bg-slate-900 h-1.5 rounded overflow-hidden mt-1">
                        <div className="bg-cyan-400 h-full transition-all duration-150" style={{ width: `${p00}%` }}></div>
                      </div>
                    </div>
                    <div className="p-2 bg-slate-950/60 rounded border border-slate-800">
                      <span className="text-slate-400 block text-[10px]">Excited |01⟩:</span>
                      <div className="w-full bg-slate-900 h-1.5 rounded overflow-hidden mt-1">
                        <div className="bg-purple-400 h-full transition-all duration-150" style={{ width: `${p01}%` }}></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="text-[10px] font-mono text-emerald-400 border-t border-cyan-900/30 pt-1.5 flex justify-between">
                <span>Fidelity: 99.98%</span>
                <span>Sub-35ms Wave Collapse</span>
              </div>
            </div>

          </div>

          {/* Bottom Dock */}
          <footer className="bg-slate-900/90 border border-slate-800 p-3 rounded-lg flex items-center justify-between gap-4">
            <div className="grid grid-cols-3 gap-3 flex-1 text-xs">
              <div>
                <div className="flex justify-between text-slate-400 text-[10px] mb-0.5">
                  <span>Qubit Scale</span>
                  <span className="text-cyan-400 font-mono font-bold">{qubits} Qubits</span>
                </div>
                <input type="range" min="16" max="64" value={qubits} onChange={(e) => setQubits(Number(e.target.value))} className="w-full accent-cyan-400 h-1 bg-slate-800 rounded cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between text-slate-400 text-[10px] mb-0.5">
                  <span>Polar Angle (θ)</span>
                  <span className="text-cyan-400 font-mono font-bold">{theta}</span>
                </div>
                <input type="range" min="0" max="1.57" step="0.01" value={theta} onChange={(e) => setTheta(Number(e.target.value))} className="w-full accent-cyan-400 h-1 bg-slate-800 rounded cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between text-slate-400 text-[10px] mb-0.5">
                  <span>Azimuthal Angle (ϕ)</span>
                  <span className="text-cyan-400 font-mono font-bold">{phi}</span>
                </div>
                <input type="range" min="0" max="3.14" step="0.01" value={phi} onChange={(e) => setPhi(Number(e.target.value))} className="w-full accent-cyan-400 h-1 bg-slate-800 rounded cursor-pointer" />
              </div>
            </div>

            <button 
              onClick={handleRunModel} 
              disabled={isRunning}
              className="px-5 py-2 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-semibold text-xs rounded-lg shadow-md transition-all flex items-center gap-1.5 disabled:opacity-50"
            >
              {isRunning ? <i data-lucide="refresh-cw" className="w-3.5 h-3.5 animate-spin"></i> : <i data-lucide="play" className="w-3.5 h-3.5 fill-white"></i>}
              {isRunning ? 'EVOLVING...' : 'RUN MODEL'}
            </button>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<QuantEnginePortal />);
  </script>
</body>
</html>
