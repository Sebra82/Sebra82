<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M4</title><style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:monospace;font-size:10px;}
body{background:#090D16;color:#00CCFF;padding:12px;display:flex;justify-content:center;}
.c{width:100%;max-width:980px;display:flex;flex-direction:column;gap:8px;}
.h{display:flex;justify-content:space-between;align-items:center;}
.b{font-weight:bold;padding:2px 6px;border:1px solid #F05;color:#F05;background:rgba(255,0,85,.05);border-radius:4px;}
.b.u{border-color:#0F6;color:#0F6;background:rgba(0,255,102,.05);}
.w{width:100%;height:450px;background:#000;border:1px solid #1a2333;border-radius:4px;cursor:grab;}
.w:active{cursor:grabbing;}
canvas{width:100%;height:100%;display:block;}
.p{border:1px solid #1a2333;border-radius:4px;padding:6px;background:rgba(9,13,22,.6);}
.p.a{border-color:#00CCFF;background:rgba(0,204,255,.02);}
.ph{display:flex;justify-content:space-between;margin-bottom:2px;color:#8ab4f8;}
.ps{color:#F05;}.ps.v{color:#0F6;}
.g{display:flex;gap:6px;margin-top:2px;}
input{background:#000;border:1px solid #00CCFF;color:#0F6;padding:5px;flex-grow:1;border-radius:3px;outline:none;}
button{background:rgba(0,204,255,.1);border:1px solid #00CCFF;color:#00CCFF;padding:5px 12px;cursor:pointer;border-radius:3px;}
.o{margin-top:4px;color:#0F6;white-space:pre-wrap;display:none;}
</style></head><body>
<div class="c">
    <div class="h"><div>M4P-V6.99_ACTIVE_LINE_MATRIX</div><div class="b" id="b">ENC_LOCKED</div></div>
    <div class="w" id="wrapper"><canvas id="canvas"></canvas></div>
    <div class="p a" id="cp">
        <div class="ph"><span>SYS_VAULT_GATEWAY // CORE_VALIDATOR</span><span class="ps" id="gs">[VAULT STATUS] Locked. Enter key.</span></div>
        <div class="g"><input type="password" id="gk" placeholder="AUTH..."><button onclick="auth()">ENTER</button></div>
    </div>
    <div id="q"></div>
</div>
<script>
const M=[]; // Paste your encrypted numerical array directly here
const TARGET="0d2f0980ff3ec551b9ab62689ef2e3d3fa54e3d93cb566cf2c2f6d2036573c00";
const NM=["HYDRO_MATRIX","XD_OBFUSCATION"];
NM.forEach((n,i)=>{document.getElementById("q").innerHTML+=`<div class="p" id="q${i}"><div class="ph"><span>QTR_${i+1} // ${n}</span><span class="ps" id="s${i}">[AES-256 VAULT ENCRYPTED]</span></div><div class="o" id="o${i}"></div></div><div style="height:6px"></div>`;});
async function auth(){
    const inp=document.getElementById("gk").value,buf=new TextEncoder().encode(inp),hash=await crypto.subtle.digest('SHA-256',buf);
    const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hex===TARGET||inp.toLowerCase()==="chronos"){
        const key=inp.toLowerCase().split('').reduce((a,c)=>a+c.charCodeAt(0),0)-649;let res="";
        for(let j=0;j<M.length;j++)res+=String.fromCharCode((j%2===0)?(M[j]^key)^0x0F:(M[j]^key)-5);
        const split=res.split(String.fromCharCode(37)+String.fromCharCode(37));
        document.getElementById("b").innerText="ENC_UNLOCKED";document.getElementById("b").className="b u";
        document.getElementById("gs").innerText="[SUCCESS] Core interlock accepted.";document.getElementById("gs").className="ps v";
        for(let i=0;i<split.length&&i<NM.length;i++){
            document.getElementById(`q${i}`).className="p a";document.getElementById(`s${i}`).innerText="[DECRYPTED]";
            document.getElementById(`s${i}`).className="ps v";const el=document.getElementById(`o${i}`);el.innerText=split[i].trim();el.style.display="block";
        }
    }else{document.getElementById("gs").innerText="[FAILED] Signature mismatch.";document.getElementById("gk").value="";}
}
const cv=document.getElementById("canvas"),cx=cv.getContext("2d"),wrap=document.getElementById("wrapper");
let w,h,pts=[],rx=0,ry=0,drag=!1,sx,sy,pulseTime=0;
let mouseX=0,mouseY=0; // Tracks live interaction displacement vectors

function resize(){
    const dpr=window.devicePixelRatio||1;
    w=wrap.clientWidth;h=wrap.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;cx.scale(dpr,dpr);
}
window.addEventListener("resize",resize);resize();

// 🔮 INTENSE 4D TOPOGRAPHY GENERATOR (100 Nodes Geodetic Layer Allocation Set)
const config=[[15,1.5],[35,3.2],[50,5.8]];let idx=0;
config.forEach(([tot,rad]) => {
    for(let i=0;i<tot;i++){
        let phi=Math.acos(1-2*(i+.5)/tot),th=Math.PI*(1+Math.sqrt(5))*i;
        let x=rad*Math.sin(phi)*Math.cos(th)*32,y=rad*Math.sin(phi)*Math.sin(th)*32,z=rad*Math.cos(phi)*32;
        let tx=x*Math.cos(idx)-y*Math.sin(idx),ty=x*Math.sin(idx)+y*Math.cos(idx),tz=z+(Math.sin(x+y)*.2);
        if(idx%2===0){tx*=.5;ty*=.5;tz*=.5;}
        // Store phase bias parameter directly in the vertex record to power local distortion engines
        pts.push({x:tx,y:ty,z:tz,baseRad:rad,bias:idx});
        idx++;
    }
});

function ptr(e){return e.touches?e.touches[0]:e;}
const start=(e)=>{drag=!0;const p=ptr(e);sx=p.clientX;sy=p.clientY;};
const move=(e)=>{
    const p=ptr(e);
    // Track cursor coordinates relative to screen canvas center for physics projection distortions
    const rect=cv.getBoundingClientRect();
    mouseX=(p.clientX-rect.left)-(w/2);
    mouseY=(p.clientY-rect.top)-(h/2);
    if(!drag)return;
    ry+=(p.clientX-sx)*.006;rx+=(p.clientY-sy)*.006;sx=p.clientX;sy=p.clientY;
};
const stop=()=>drag=!1;

wrap.addEventListener("mousedown",start);window.addEventListener("mousemove",move);window.addEventListener("mouseup",stop);
wrap.addEventListener("touchstart",start,{passive:!0});wrap.addEventListener("touchmove",move,{passive:!0});wrap.addEventListener("touchend",stop);

function frame(){
    cx.clearRect(0,0,w,h);let midX=w/2,midY=h/2;
    if(!drag){ry+=.002;rx+=.001;}
    pulseTime+=0.025; // Powers the dynamic breathing loop

    // Compute live metric breathing expansion scalar
    let breatheScale=1+Math.sin(pulseTime)*0.08;

    let tpts=pts.map(p=>{
        // Apply synchronized breathing contraction directly to structural vertex positions
        let curX=p.x*breatheScale,curY=p.y*breatheScale,curZ=p.z*breatheScale;
        
        // Interactive proximity field tracking: warp nodes closest to active user mouse positions
        let dx=curX-mouseX,dy=curY-mouseY;
        let mouseDist=Math.hypot(dx,dy);
        if(mouseDist<120){
            let pushFactor=(1-(mouseDist/120))*6;
            curX+=dx/mouseDist*pushFactor;curY+=dy/mouseDist*pushFactor;
        }

        let y1=curY*Math.cos(rx)-curZ*Math.sin(rx),z1=curY*Math.sin(rx)+curZ*Math.cos(rx);
        let x2=curX*Math.cos(ry)+z1*Math.sin(ry),z2=-curX*Math.sin(ry)+z1*Math.cos(ry);
        return{x:x2+midX,y:y1+midY,z:z2};
    });

    // High-definition interactive network linking pass
    let fc=0;cx.strokeStyle="rgba(0,255,102,0.15)";cx.lineWidth=.5;
    for(let i=0;i<tpts.length&&fc<800;i++){
        for(let j=i+1;j<tpts.length&&fc<800;j++){
            let d=Math.hypot(tpts[i].x-tpts[j].x,tpts[i].y-tpts[j].y);
            if(d>20&&d<115){
                cx.beginPath();cx.moveTo(tpts[i].x,tpts[i].y);cx.lineTo(tpts[j].x,tpts[j].y);cx.stroke();fc++;
            }
        }
    }
    tpts.forEach(p=>{
        cx.fillStyle=p.z>0?"#00CCFF":"#ff0055";cx.beginPath();
        cx.arc(p.x,p.y,p.z>0?3.5:2.2,0,2*Math.PI);cx.fill();
    });
    cx.fillStyle="#FFFFFF";cx.beginPath();cx.arc(midX,midY,4.5,0,2*Math.PI);cx.fill();
    requestAnimationFrame(frame);
}frame();
</script></body></html>
