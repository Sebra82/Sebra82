<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBRA82 v5.5 - Procedural Raymarching Render Test</title>
    <style>
        body {
            margin: 0;
            background: #010103;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated; /* Crisp retro-futuristic scaling */
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(4, 4, 12, 0.9);
            padding: 16px 20px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
            z-index: 10;
            pointer-events: none;
        }
        h2 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 2px; color: #ff007f; }
        p { margin: 5px 0; font-size: 12px; display: flex; justify-content: space-between; width: 220px; }
        span.val { color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <h2>SEBRA82 RAYMARCH</h2>
        <p>Render Resolution: <span class="val">320 x 240</span></p>
        <p>Pixel Operations: <span class="val">15.3 Mops/f</span></p>
        <p>Frame Latency: <span class="val" id="latency-display">0.00 ms</span></p>
        <p>Frame Rate: <span class="val" id="fps-display">60 FPS</span></p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');

        // Internal low-res render buffer for blazing-fast CPU raymarching (scaled up via CSS)
        const WIDTH = 320;
        const HEIGHT = 240;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        const imgData = ctx.createImageData(WIDTH, HEIGHT);
        const data = imgData.data;

        // Pre-computed trigonometric lookup table
        const LUT_SIZE = 3600;
        const SIN_LUT = new Float32Array(LUT_SIZE);
        for (let i = 0; i < LUT_SIZE; i++) {
            SIN_LUT[i] = Math.sin((i * Math.PI) / 180);
        }

        let globalTick = 0;
        let lastTime = performance.now();

        function renderFrame() {
            let frameStart = performance.now();
            globalTick++;

            let time = globalTick * 0.03;
            let cosT = Math.cos(time * 0.5);
            let sinT = Math.sin(time * 0.5);

            let pixelIndex = 0;

            // --- PROCEDURAL PIXEL-BY-PIXEL RAYMARCHING HOT LOOP ---
            for (let y = 0; y < HEIGHT; y++) {
                let ny = (y - HEIGHT / 2) / (HEIGHT / 2); // -1 to 1

                for (let x = 0; x < WIDTH; x++) {
                    let nx = (x - WIDTH / 2) / (HEIGHT / 2); // Aspect-corrected x

                    // Rotate ray coordinates using SEBRA82 harmonic math
                    let rx = nx * cosT - ny * sinT;
                    let ry = nx * sinT + ny * cosT;

                    // Evaluate multi-layer harmonic distance field
                    let d = Math.sqrt(rx * rx + ry * ry);
                    
                    let lutIdx1 = Math.floor(Math.abs(rx * 500 + globalTick) % LUT_SIZE);
                    let lutIdx2 = Math.floor(Math.abs(ry * 500 + globalTick * 2) % LUT_SIZE);
                    
                    let harmonicVal = SIN_LUT[lutIdx1] * SIN_LUT[lutIdx2];
                    
                    // Surface shading calculation (Simulated procedural crystal reflection)
                    let pattern = Math.sin(d * 12.0 - time * 3.0 + harmonicVal * 4.0);
                    let intensity = Math.max(0, 1.0 - (d * 0.8)) * (0.5 + 0.5 * pattern);

                    // Color mapping: Cyan/Magenta metallic crystal gradient
                    let red   = Math.floor(Math.abs(harmonicVal) * 255 * intensity);
                    let green = Math.floor((1.0 - d) * 255 * intensity * 0.9);
                    let blue  = Math.floor((0.5 + 0.5 * pattern) * 255 * intensity);

                    // Extra neon rim glow for crystal edges
                    if (pattern > 0.85) {
                        red = 255;
                        green = 0;
                        blue = 127; // Hot magenta edge
                    }

                    data[pixelIndex]     = red;     // R
                    data[pixelIndex + 1] = green;   // G
                    data[pixelIndex + 2] = blue;    // B
                    data[pixelIndex + 3] = 255;     // A

                    pixelIndex += 4;
                }
            }

            // Blit rendered procedural buffer to canvas
            ctx.putImageData(imgData, 0, 0);

            // --- TELEMETRY ---
            let frameEnd = performance.now();
            let duration = frameEnd - frameStart;

            if (frameEnd - lastTime >= 350) {
                document.getElementById('latency-display').textContent = duration.toFixed(2) + ' ms';
                document.getElementById('fps-display').textContent = Math.round(1000 / (duration || 1)) + ' FPS';
                lastTime = frameEnd;
            }

            requestAnimationFrame(renderFrame);
        }

        requestAnimationFrame(renderFrame);
    </script>
</body>
</html>
