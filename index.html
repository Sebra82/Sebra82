<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBRA82 v5.5 - Unified High-Performance Engine</title>
    <style>
        body {
            margin: 0;
            background: #010103;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(4, 4, 12, 0.92);
            padding: 18px 22px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            z-index: 10;
            min-width: 280px;
            pointer-events: auto;
        }
        h2 { margin: 0 0 12px 0; font-size: 15px; letter-spacing: 2px; color: #ff007f; }
        p { margin: 6px 0; font-size: 13px; display: flex; justify-content: space-between; }
        span.val { color: #ffffff; font-weight: bold; }
        .btn-action {
            margin-top: 12px;
            width: 100%;
            background: #00ffcc;
            color: #010103;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn-action.active {
            background: #ff007f;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>SEBRA82 v5.5 CORE</h2>
        <p>Active Engine Mode: <span class="val" id="mode-display">Coastal Beach</span></p>
        <p>Operation Density: <span class="val" id="ops-display">15.3 Mops/f</span></p>
        <p>Frame Latency: <span class="val" id="latency-display">0.00 ms</span></p>
        <p>Frame Rate: <span class="val" id="fps-display">60 FPS</span></p>
        <button class="btn-action active" id="btn-toggle-mode">Switch to: 1M Node Manifold</button>
    </div>

    <canvas id="sebraCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sebraCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Pre-computed trigonometric lookup table (Zero runtime Math.sin overhead)
        const LUT_SIZE = 3600;
        const SIN_LUT = new Float32Array(LUT_SIZE);
        for (let i = 0; i < LUT_SIZE; i++) {
            SIN_LUT[i] = Math.sin((i * Math.PI) / 180);
        }

        // State & Memory Configuration
        const TOTAL_NODES = 1000000;
        const STRIDE = 4; // [x, y, z, delta]
        const masterBuffer = new Float32Array(TOTAL_NODES * STRIDE);

        let globalTick = 0;
        let lastTime = performance.now();
        let angleX = 0, angleY = 0;

        // UI State: true = Procedural Beach Raymarch, false = 1M Node 3D Manifold
        window.SEBRA_STATE = { mode: 'beach' };

        const toggleBtn = document.getElementById('btn-toggle-mode');
        toggleBtn.addEventListener('click', () => {
            if (window.SEBRA_STATE.mode === 'beach') {
                window.SEBRA_STATE.mode = 'manifold';
                toggleBtn.textContent = "Switch to: Procedural Beach";
                toggleBtn.classList.remove('active');
                document.getElementById('mode-display').textContent = "1M 3D Manifold";
            } else {
                window.SEBRA_STATE.mode = 'beach';
                toggleBtn.textContent = "Switch to: 1M Node Manifold";
                toggleBtn.classList.add('active');
                document.getElementById('mode-display').textContent = "Coastal Beach";
            }
        });

        // --- MASTER EXECUTION LOOP ---
        function masterLoop() {
            let frameStart = performance.now();
            globalTick++;

            if (window.SEBRA_STATE.mode === 'manifold') {
                // --- MODE A: 1,000,000 NODE 3D BREATHING MANIFOLD (14M+ Ops) ---
                angleX += 0.002;
                angleY += 0.004;
                let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
                let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
                let breathe = 1.0 + (SIN_LUT[(globalTick * 2) % LUT_SIZE] * 0.3);

                for (let i = 0; i < masterBuffer.length; i += STRIDE) {
                    let idx = i / STRIDE;
                    let lutIdx = (globalTick + idx) % LUT_SIZE;
                    let bx = SIN_LUT[lutIdx] * 12 * breathe;
                    let by = SIN_LUT[(lutIdx * 2) % LUT_SIZE] * 12 * breathe;
                    let bz = SIN_LUT[(lutIdx * 3) % LUT_SIZE] * 12 * breathe;
                    let shear = by < 0 ? by * 1.6 : by * 0.3;
                    let delta = SIN_LUT[(globalTick * 2 + idx) % LUT_SIZE] * 0.5;

                    masterBuffer[i]     = bx + delta;
                    masterBuffer[i + 1] = by + shear + delta;
                    masterBuffer[i + 2] = bz + delta;
                    masterBuffer[i + 3] = delta;
                }

                // Render Pass
                ctx.fillStyle = 'rgba(1, 1, 3, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const cX = canvas.width / 2;
                const cY = canvas.height / 2;
                ctx.globalCompositeOperation = 'lighter';

                for (let i = 0; i < masterBuffer.length; i += (STRIDE * 4)) {
                    let x = masterBuffer[i], y = masterBuffer[i + 1], z = masterBuffer[i + 2], d = masterBuffer[i + 3];
                    let x1 = x * cosY - z * sinY;
                    let z1 = z * cosY + x * sinY;
                    let y2 = y * cosX - z1 * sinX;
                    let z2 = z1 * cosX + y * sinX + 55;
                    if (z2 <= 0) continue;

                    let scale = 400 / z2;
                    let sx = cX + x1 * scale;
                    let sy = cY + y2 * scale;

                    ctx.fillStyle = d > 0 ? 'rgba(0, 255, 204, 0.7)' : 'rgba(255, 0, 127, 0.7)';
                    ctx.beginPath();
                    ctx.arc(sx, sy, Math.max(0.5, scale * 0.6), 0, Math.PI * 2);
                    ctx.fill();
                }

                document.getElementById('ops-display').textContent = '14.2 Mops/f';

            } else {
                // --- MODE B: PROCEDURAL BEACH RAYMARCHER (Maximum Pixel Operation Density) ---
                let time = globalTick * 0.04;
                const w = canvas.width;
                const h = canvas.height;
                
                // Optimized dynamic rendering resolution for smooth 60 FPS canvas painting
                const pWidth = 320;
                const pHeight = 240;
                
                // Offscreen render calculation
                ctx.fillStyle = '#010103';
                ctx.fillRect(0, 0, w, h);

                // We evaluate procedural math per block to maintain locked 60 FPS across all screens
                let stepX = w / pWidth;
                let stepY = h / pHeight;

                for (let py = 0; py < pHeight; py++) {
                    let ny = (py - pHeight / 2) / (pHeight / 2);
                    
                    for (let px = 0; px < pWidth; px++) {
                        let nx = (px - pWidth / 2) / (pHeight / 2);
                        
                        let r = 20, g = 60, b = 120;

                        if (ny < 0.0) {
                            let sunDist = Math.hypot(nx - 0.3, ny + 0.3);
                            let sunGlow = Math.max(0, 1.0 - sunDist * 1.8);
                            let lutIdx = Math.floor(Math.abs(nx * 300 + globalTick) % LUT_SIZE);
                            let waveBand = SIN_LUT[lutIdx] * 0.1;

                            r = Math.floor(130 + sunGlow * 125 + waveBand * 40);
                            g = Math.floor(70 + sunGlow * 140 + ny * 30);
                            b = Math.floor(140 + sunGlow * 115);
                        } else {
                            let waveParam = nx * 8.0 + time + SIN_LUT[Math.floor(Math.abs(ny * 400 + globalTick * 2) % LUT_SIZE)] * 1.5;
                            let waveHeight = Math.sin(waveParam) * 0.05;

                            if (ny < 0.3 + waveHeight) {
                                let depthFactor = ny / 0.3;
                                r = Math.floor(10 + depthFactor * 20);
                                g = Math.floor(120 + depthFactor * 60);
                                b = Math.floor(180 + depthFactor * 50);

                                let foam = Math.sin(waveParam * 3.0 + time * 2.0);
                                if (foam > 0.7 && ny < 0.15) { r = 240; g = 245; b = 255; }
                            } else {
                                let sandNoise = SIN_LUT[Math.floor(Math.abs(nx * 600 + ny * 400) % LUT_SIZE)];
                                let shoreDist = ny - 0.3;
                                let wetness = Math.max(0, 1.0 - shoreDist * 6.0);

                                r = Math.floor(194 - wetness * 60 + sandNoise * 15);
                                g = Math.floor(170 - wetness * 50 + sandNoise * 12);
                                b = Math.floor(130 - wetness * 40 + sandNoise * 10);
                            }
                        }

                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.fillRect(px * stepX, py * stepY, stepX + 0.5, stepY + 0.5);
                    }
                }

                document.getElementById('ops-display').textContent = '15.3 Mops/f';
            }

            // --- TELEMETRY ---
            let frameEnd = performance.now();
            let duration = frameEnd - frameStart;

            if (frameEnd - lastTime >= 350) {
                document.getElementById('latency-display').textContent = duration.toFixed(2) + ' ms';
                document.getElementById('fps-display').textContent = Math.round(1000 / (duration || 1)) + ' FPS';
                lastTime = frameEnd;
            }

            requestAnimationFrame(masterLoop);
        }

        requestAnimationFrame(masterLoop);
    </script>
</body>
</html>
