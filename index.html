<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>M4</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#060913;color:#c9d1d9;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:4px;overflow:hidden}.box{width:100%;max-width:900px;background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #21262d;padding-bottom:2px}.title{font-size:10px;font-weight:700;color:#00ccff;font-family:monospace}.badge{font-size:8px;font-weight:bold;color:#ff3366;background:rgba(255,51,102,0.05);padding:1px 4px;border-radius:8px;border:1px solid rgba(255,51,102,0.1);font-family:monospace}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:6px}@media(max-width:768px){.layout{grid-template-columns:1fr}}.vp{border:1px solid #30363d;background:#03050a;border-radius:3px;position:relative;height:240px;touch-action:none;cursor:grab}canvas{position:absolute;width:100%;height:100%;display:block}.side{display:flex;flex-direction:column;gap:4px;height:240px;overflow-y:auto}.card{background:#161b22;border:1px solid #30363d;border-radius:3px;padding:4px;cursor:pointer}.active-card{border-color:#00ccff!important;background:#111a26!important}.lbl{font-size:7px;font-weight:700;color:#8b949e;text-transform:uppercase;border-bottom:1px solid #21262d;padding-bottom:1px;margin-bottom:2px;font-family:monospace}.txt{font-family:monospace;font-size:8px;color:#ff3366;word-break:break-all;line-height:1.1}.gate{display:flex;background:#161b22;border:1px solid #30363d;padding:4px;border-radius:3px;gap:4px}input{flex:1;background:#070a10;border:1px solid #30363d;color:#00ccff;padding:2px 6px;font-family:monospace;font-size:10px;outline:none;border-radius:2px}button{background:#238636;border:none;color:#fff;padding:2px 8px;font-size:10px;font-weight:600;border-radius:2px;cursor:pointer}.term{background:#03050a;border:1px solid #30363d;border-radius:3px;padding:4px;font-family:monospace;font-size:8px;color:#ff3366;min-height:45px;max-height:65px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.1}.ok-glow{border-color:#2ea043!important;box-shadow:0 0 8px rgba(46,160,67,0.1)}.ok-text{color:#56d364!important}.ok-badge{color:#56d364!important;background:rgba(46,160,67,0.03)!important;border-color:rgba(46,160,67,0.1)!important}</style></head><body><div class="box" id="wb"><div class="hdr"><div class="title" id="t1">...</div><div class="badge" id="bg">...</div></div><div class="layout"><div class="vp"><canvas id="cv"></canvas></div><div class="side"><div class="card" id="c1" onclick="sel(0)"><div class="lbl" id="l1">...</div><div class="txt" id="d1">...</div></div><div class="card" id="c2" onclick="sel(1)"><div class="lbl" id="l2">...</div><div class="txt" id="d2">...</div></div><div class="card" id="c3" onclick="sel(2)"><div class="lbl" id="l3">...</div><div class="txt" id="d3">...</div></div><div class="card" id="c4" onclick="sel(3)"><div class="lbl" id="l4">...</div><div class="txt" id="d4">...</div></div></div></div><div class="gate"><input type="password" id="key" placeholder="..." autocomplete="off"><button onclick="unlock()">►</button></div><div class="term" id="tm">...</div></div><script>
const V={
    s_t:"TTRQLVY2Ljk5X0NPTVBMRVhfNDRfS0lORU1BVElDX0VOR0lORQ==",

    p3:"W1ZJRVdQT1JUX0VOR0lORV9SRUFSTUVEXSA2MCBGUFMgcmVhbC10aW1lIGFjdGl2ZSByb3RhdGlvbiB8IG9jY2x1ZGVkIGhpZ2gtZGVmaW5pdGlvbiA1MDAtdmVydGV4IDREIGdlb2RldGljIG1lc2ggcG9seW9wdGltaXplZCBsYXllcnMu",

};
const g=id=>document.getElementById(id),conv=a=>atob(a);
g("t1").innerText=conv(V.s_t);g("tm").innerText=conv(V.s_c);g("bg").innerText=conv(V.s_b);
for(let i=1;i<=4;i++){g("l"+i).innerText=conv(V.s_l[i-1]);g("d"+i).innerText=conv(V.s_v[i-1])}
const pts=[],C=["0,204,255","255,51,102","255,170,0","187,51,255"];let sIdx=0;
for(let i=0;i<500;i++){
    let t=2*Math.PI*i/1.61803398875,p=Math.acos(1-2*(i+0.5)/500);
    pts.push({x:Math.cos(t)*Math.sin(p)*1.8,y:Math.sin(t)*Math.sin(p)*1.8,z:Math.cos(p)*1.8,w:Math.cos(t*2)*0.5,oX:Math.cos(t)*Math.sin(p)*1.8,oY:Math.sin(t)*Math.sin(p)*1.8,oZ:Math.cos(p)*1.8,oW:Math.cos(t*2)*0.5,p:t,m:1+0.3*Math.sin(t*3),g:i%4});
}
const cv=g("cv"),ctx=cv.getContext("2d");let ok=false,zoom=1.1,rx=0.003,ry=0.005,mx=0,my=0,drag=false,px=0,py=0,f=0;
function res(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight}window.addEventListener("resize",res);res();
function ptr(e){return e.targetTouches&&e.targetTouches.length>0?{x:e.targetTouches[0].clientX,y:e.targetTouches[0].clientY}:{x:e.clientX,y:e.clientY}}
cv.addEventListener("mousedown",(e)=>{drag=true;const p=ptr(e);px=p.x;py=p.y});window.addEventListener("mousemove",(e)=>{if(!drag)return;const p=ptr(e);my+=(p.x-px)*0.008;mx+=(p.y-py)*0.008;px=p.x;py=p.y});window.addEventListener("mouseup",()=>{drag=false});
cv.addEventListener("touchstart",(e)=>{drag=true;const p=ptr(e);px=p.x;py=p.y},{passive:true});cv.addEventListener("touchmove",(e)=>{if(!drag)return;const p=ptr(e);my+=(p.x-px)*0.008;mx+=(p.y-py)*0.008;px=p.x;py=p.y},{passive:true});cv.addEventListener("touchend",()=>{drag=false});
function sel(idx){sIdx=idx;for(let i=1;i<=4;i++)g("c"+i).classList.remove("active-card");g("c"+(idx+1)).classList.add("active-card")}sel(0);
function loop(){
    f+=0.02;ctx.clearRect(0,0,cv.width,cv.height);const cx=cv.width/2,cy=cv.height/2,scale=Math.min(cx,cy)*0.28*zoom,ax=rx+mx,ay=ry+my,aw=f*0.5;
    if(!drag){mx*=0.95;my*=0.96}rx+=0.001;ry+=0.002;
    pts.forEach(p=>{
        let d=Math.sin(p.p+f)*0.15*p.m,tX=p.oX*(1+d),tY=p.oY*(1+d),tZ=p.oZ*(1+d),tW=p.oW+Math.sin(f+p.p)*0.3,cW=Math.cos(aw),sW=Math.sin(aw);
        p.z=tZ*cW-tW*sW;p.w=tZ*sW+tW*cW;p.x=tX;p.y=tY;
    });
    const proj=pts.map(p=>{let y1=p.y*Math.cos(ax)-p.z*Math.sin(ax),z1=p.y*Math.sin(ax)+p.z*Math.cos(ax),x2=p.x*Math.cos(ay)+z1*Math.sin(ay);return{x:cx+x2*scale,y:cy+y1*scale,z:-p.x*Math.sin(ay)+z1*Math.cos(ay),w:p.w}});
    for(let i=0;i<proj.length;i++){
        for(let j=i+1;j<proj.length;j++){
            let d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y,pts[i].z-pts[j].z);
            if(d<0.45){
                let isA=(pts[i].g===sIdx||pts[j].g===sIdx),rgb=isA?C[sIdx]:(ok?C[pts[i].g]:"255,51,102"),op=isA?0.6-d*0.5:(ok?0.2-d*0.2:0.15-d*0.15),factor=1-Math.min(Math.max((proj[i].w+proj[j].w+1)/2,0),1);op*=factor;
                ctx.beginPath();ctx.moveTo(proj[i].x,proj[i].y);ctx.lineTo(proj[j].x,proj[j].y);ctx.strokeStyle=`rgba(${rgb},${op})`;ctx.stroke();
            }
        }
    }
    proj.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,pts[i].g===sIdx?2.0:0.8,0,2*Math.PI);let rgb=pts[i].g===sIdx?C[sIdx]:(ok?C[pts[i].g]:"255,51,102");ctx.fillStyle=`rgb(${rgb})`;ctx.fill()});
    requestAnimationFrame(loop);
}requestAnimationFrame(loop);
function unlock(){
    if(g("key").value.trim()==="CHRONOS_ALPHA_99"){
        ok=true;g("bg").innerText="ACCESS_GRANTED";g("bg").className="badge ok-badge";g("wb").className="box ok-glow";
        g("d1").innerHTML=conv(V.p1);g("d2").innerHTML=conv(V.p2);g("d3").innerHTML=conv(V.p3);g("d4").innerHTML=conv(V.p4);g("tm").innerHTML=conv(V.g_o);g("tm").style.color="#56d364";
        for(let i=1;i<=4;i++)g("d"+i).className="txt ok-text";
    }else{alert("ACCESS DENIED.")}
}
