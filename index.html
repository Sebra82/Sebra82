const conv=(a)=>atob(a);document.getElementById('t1').innerText=conv(V.s_t);document.getElementById('tm').innerText=conv(V.s_c);document.getElementById('bg').innerText=conv(V.s_b);for(let i=1;i<=4;i++){document.getElementById('l'+i).innerText=conv(V.s_l[i-1]);document.getElementById('d'+i).innerText=conv(V.s_v[i-1])}const pts=V.XYZ.map(p=>({x:p.x,y:p.y,z:p.z}));const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let ok=false,zoom=1.0,rx=0.003,ry=0.005,mx=0,my=0,drag=false,px=0,py=0;function res(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight}window.addEventListener('resize',res);res();function ptr(e){return e.targetTouches&&e.targetTouches.length>0?{x:e.targetTouches[0].clientX,y:e.targetTouches[0].clientY}:{x:e.clientX,y:e.clientY}}function start(e){drag=true;const p=ptr(e);px=p.x;py=p.y}function move(e){if(!drag)return;const p=ptr(e);my+=(p.x-px)*0.008;mx+=(p.y-py)*0.008;px=p.x;py=p.y}function end(){drag=false}cv.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);cv.addEventListener('touchstart',start,{passive:true});cv.addEventListener('touchmove',move,{passive:true});cv.addEventListener('touchend',end);function loop(){ctx.clearRect(0,0,cv.width,cv.height);const cx=cv.width/2,cy=cv.height/2,scale=Math.min(cx,cy)*0.28*zoom,ax=rx+mx,ay=ry+my;if(!drag){mx*=0.95;my*=0.96}rx+=0.001;ry+=0.002;const proj=pts.map(p=>{let y1=p.y*Math.cos(ax)-p.z*Math.sin(ax),z1=p.y*Math.sin(ax)+p.z*Math.cos(ax),x2=p.x*Math.cos(ay)+z1*Math.sin(ay);return{x:cx+x2*scale,y:cy+y1*scale,z:-p.x*Math.sin(ay)+z1*Math.cos(ay)}});for(let i=0;i<proj.length;i++){for(let j=i+1;j<proj.length;j++){if(Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y,pts[i].z-pts[j].z)<0.95){ctx.beginPath();ctx.moveTo(proj[i].x,proj[i].y);ctx.lineTo(proj[j].x,proj[j].y);ctx.strokeStyle=ok?`rgba(86,211,100,0.35)`:`rgba(255,51,102,0.25)`;ctx.stroke()}}}proj.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,ok?3.5:2.5,0,2*Math
