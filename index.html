let w,h,pts=[],rx=0,ry=0,drag=!1,sx,sy,pTime=0,mx=-_L100,my=-_L100;
function resize(){const dpr=window.devicePixelRatio||1;w=wr.clientWidth;h=wr.clientHeight;c.width=w*dpr;c.height=h*dpr;cx.scale(dpr,dpr);}

const cfg=[[(_L10*_L5),1.5],[(_L100+(_L10*_L5)),3.2],[(_L100*_L3),5.8]];let idx=0;
cfg.forEach(([tot,rad])=>{
    for(let i=0;i<tot;i++){
        let phi=Math.acos(1-2*(i+0.5)/tot),th=Math.PI*(1+Math.sqrt(_L5))*i;
        let x=rad*Math.sin(phi)*Math.cos(th)*_L30,y=rad*Math.sin(phi)*Math.sin(th)*_L30,z=rad*Math.cos(phi)*_L30;
        let tx=x*Math.cos(idx)-y*Math.sin(idx),ty=x*Math.sin(idx)+y*Math.cos(idx),tz=z+(Math.sin(x+y)*0.2);
        if(idx%_L2===0){tx*=.5;ty*=.5;tz*=.5;}
        pts.push({x:tx,y:ty,z:tz});idx++;
    }
});

function ptr(e){return e.touches?e.touches[0]:e;}
const st=(e)=>{drag=!0;const p=ptr(e);sx=p.clientX;sy=p.clientY;};

    const p=ptr(e),rect=c.getBoundingClientRect();mx=(p.clientX-rect.left)-(w/2);my=(p.clientY-rect.top)-(h/2);
    if(!drag)return;ry+=(p.clientX-sx)*.006;rx+=(p.clientY-sy)*.006;sx=p.clientX;sy=p.clientY;
};

function frame(){
    cx.clearRect(0,0,w,h);let mX=w/2,mY=h/2;if(!drag){ry+=.002;rx+=.001;}pTime+=0.025;
    let bS=1+Math.sin(pTime)*0.08;

        let cX=p.x*bS,cY=p.y*bS,cZ=p.z*bS,dX=cX-mx,dY=cY-my,md=Math.hypot(dX,dY);

        return{x:x2+mX,y:y1+mY,z:z2};
    });
    let fc=0;cx.strokeStyle="rgba(0,255,102,0.14)";cx.lineWidth=0.5;
    for(let i=0; i<tpts.length&&fc<1200; i++){
        for(let j=i+1; j<tpts.length&&fc<1200; j++){
            let d=Math.hypot(tpts[i].x-tpts[j].x,tpts[i].y-tpts[j].y);
            if(d>10&&d<65){cx.beginPath();cx.moveTo(tpts[i].x,tpts[i].y);cx.lineTo(tpts[j].x,tpts[j].y);cx.stroke();fc++;}
        }
    }
    tpts.forEach(p=>{cx.fillStyle=p.z>0?"#00CCFF":"#ff0055";cx.beginPath();cx.arc(p.x,p.y,p.z>0?2.6:1.4,0,2*Math.PI);cx.fill();});
    cx.fillStyle="#FFFFFF";cx.beginPath();cx.arc(mX,mY,4,0,2*Math.PI);cx.fill();
    requestAnimationFrame(frame);
}frame();
