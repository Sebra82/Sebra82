<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebra82 // Micro-Console</title>
    <style>
        :root {
            --bg: #020305;
            --cyan: #00f3ff;
            --green: #00ff66;
            --panel: rgba(6, 9, 14, 0.98);
            --border: rgba(0, 243, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }

        body {
            background: var(--bg);
            color: #74808e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .console-container {
            width: 100%;
            max-width: 290px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 8px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.04);
        }

        header {
            border-bottom: 1px dashed var(--border);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-group { overflow: hidden; width: 85%; }

        .core-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
        }

        .core-spec {
            font-size: 0.62rem;
            color: #334155;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pulse-dot {
            width: 4px;
            height: 4px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #waveCanvas {
            width: 100%;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            margin-bottom: 6px;
        }

        .telemetry-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.3);
            border-left: 1.5px solid var(--cyan);
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.68rem;
        }

        .metric-card:hover { border-left-color: var(--green); }
        .metric-value { font-weight: bold; font-variant-numeric: tabular-nums; }
        .hl-blue { color: var(--cyan); }
        .hl-green { color: var(--green); }
    </style>
</head>
<body>

    <div class="console-container">
        <header>
            <div class="title-group" onclick="scrambleHeader()">
                <div class="core-title" id="mainTitle">M4 Ultra</div>
                <div class="core-spec" id="subSpec">M4P // RENDER // 1836</div>
            </div>
            <div class="pulse-dot"></div>
        </header>

        <canvas id="waveCanvas"></canvas>

        <main class="telemetry-grid">
            <div class="metric-card" onclick="manipulateNumbers('entropyVal', 0, 0, 4, ' S_vN')">
                <span>Entropy</span>
                <span class="metric-value hl-green" id="entropyVal">0.0000 S_vN</span>
            </div>
            <div class="metric-card" onclick="manipulateNumbers('phaseVal', 0.0010, 0.0090, 4, ' r/s')">
                <span>Phase</span>
                <span class="metric-value hl-blue" id="phaseVal">0.0040 r/s</span>
            </div>
            <div class="metric-card" onclick="scrambleSubspace()">
                <span>Hilbert</span>
                <span class="metric-value" id="subspaceVal">2⁹⁹ VIRTUAL</span>
            </div>
            <div class="metric-card" id="nnCard">
                <span>Neural</span>
                <span class="metric-value hl-green" id="ewcVal">EMBEDDED</span>
            </div>
        </main>
    </div>

    <script>
        const SYSTEM_STATE = Object.freeze({
            entropyVal: '0.0000 S_vN',
            phaseVal: '0.0040 r/s',
            subspaceVal: '2⁹⁹ VIRTUAL',
            matrixChars: "ΨΩαβγδεζηX012345%"
        });

        const activeLoops = { text: new Map(), num: new Map(), subspace: null };
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas?.getContext('2d');
        let angleX = 0, angleY = 0;

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Core 3D structural vertices points 
        const vertices3D = [
            {x: -1, y: -1, z: -1}, {x: 1, y: -1, z: -1}, {x: 1, y: 1, z: -1}, {x: -1, y: 1, z: -1},
            {x: -1, y: -1, z: 1}, {x: 1, y: -1, z: 1}, {x: 1, y: 1, z: 1}, {x: -1, y: 1, z: 1}
        ];
        
        // Complete structural index map connections for edge rendering
        const edges3D = [
            0, 1, 1, 2, 2, 3, 3, 0, // Back plane loop
            4, 5, 5, 6, 6, 7, 7, 4, // Front plane loop
            0, 4, 1, 5, 2, 6, 3, 7  // Depth bridge links
        ];

        function animate3D() {
            if (!ctx || !canvas) return;
            try {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const cx = canvas.width / 2, cy = canvas.height / 2, projected2D = [];

                vertices3D.forEach(v => {
                    let x1 = v.x * Math.cos(angleY) - v.z * Math.sin(angleY);
                    let z1 = v.x * Math.sin(angleY) + v.z * Math.cos(angleY);
                    let y2 = v.y * Math.cos(angleX) - z1 * Math.sin(angleX);
                    let z2 = v.y * Math.sin(angleX) + z1 * Math.cos(angleX);

                    // Multiplier scaled perfectly for low height bounds (24px)
                    const factor = 1 / (3.0 - z2);
                    projected2D.push({ x: cx + x1 * factor * 35, y: cy + y2 * factor * 16 });
                });

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.85)';
                ctx.lineWidth = 1;
                
                // Fixed iterative node-pair draw array routine
                for (let i = 0; i < edges3D.length; i += 2) {
                    const p1 = projected2D[edges3D[i]];
                    const p2 = projected2D[edges3D[i+1]];
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                }
                ctx.stroke();
                angleX += 0.012; angleY += 0.018;
            } catch (e) {}
            requestAnimationFrame(animate3D);
        }
        animate3D();

        function scrambleHeader() {
            const specEl = document.getElementById('subSpec');
            if (!specEl) return;
            const original = "M4P // RENDER // 1836";
            
            if (activeLoops.text.has(specEl)) clearInterval(activeLoops.text.get(specEl));
            let iter = 0;
            const interval = setInterval(() => {
                specEl.innerText = original.split("").map((c, i) => i < iter ? original[i] : (c === " " ? " " : SYSTEM_STATE.matrixChars[Math.floor(Math.random() * SYSTEM_STATE.matrixChars.length)])).join("");
                if (iter >= original.length) { clearInterval(interval); specEl.innerText = original; }
                iter += 2;
            }, 20);
            activeLoops.text.set(specEl, interval);
        }

        function manipulateNumbers(elementId, min, max, decimals, suffix) {
            const el = document.getElementById(elementId);
            if (!el) return;
            if (activeLoops.num.has(elementId)) clearInterval(activeLoops.num.get(elementId));
            let d = 0;
            const interval = setInterval(() => {
                el.innerText = (Math.random() * (max - min) + min).toFixed(decimals) + suffix;
                d += 50;
                if (d > 500) { clearInterval(interval); el.innerText = SYSTEM_STATE[elementId]; }
            }, 50);
            activeLoops.num.set(elementId, interval);
        }

        function scrambleSubspace() {
            const el = document.getElementById('subspaceVal');
            if (!el || activeLoops.subspace) return;
            let c = 0;
            activeLoops.subspace = setInterval(() => {
                el.innerText = `2¹${Math.floor(Math.random() * 9)} FLUX`;
                if (++c > 8) { clearInterval(activeLoops.subspace); activeLoops.subspace = null; el.innerText = SYSTEM_STATE.subspaceVal; }
            }, 50);
        }

        document.getElementById('nnCard')?.addEventListener('mouseenter', () => {
            const target = document.getElementById('ewcVal');
            if (target && !activeLoops.text.has(target)) {
                let orig = "EMBEDDED", iter = 0;
                const interval = setInterval(() => {
                    target.innerText = orig.split("").map((c, i) => i < iter ? orig[i] : SYSTEM_STATE.matrixChars[Math.floor(Math.random() * SYSTEM_STATE.matrixChars.length)]).join("");
                    if (iter >= orig.length) { clearInterval(interval); activeLoops.text.delete(target); target.innerText = orig; }
                    iter++;
                }, 30);
                activeLoops.text.set(target, interval);
            }
        });
    </script>
</body>
</html>
