<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantEngine SaaS — Quantum Model Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX Compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #030611;
      color: #f1f5f9;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen antialiased select-none">

  <!-- React Root -->
  <div id="root"></div>

  <!-- Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function QuantEnginePortal() {
      const [qubits, setQubits] = useState(64);
      const [theta, setTheta] = useState(0.41);
      const [phi, setPhi] = useState(0.85);
      const [isRunning, setIsRunning] = useState(false);
      const [activeStep, setActiveStep] = useState(0);
      const [activeTab, setActiveTab] = useState('sandbox');

      // Safeguard Lucide Icon rendering
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeStep, activeTab, isRunning]);

      // State derivations
      const totalStates = Math.pow(2, qubits);
      const formattedStates = totalStates > 1e12 
        ? (totalStates / 1e18).toFixed(1) + ' Quintillion' 
        : totalStates.toLocaleString();

      const c00 = Math.cos(theta / 2).toFixed(2);
      const c01 = Math.sin(theta / 2).toFixed(2);
      const phaseExp = phi.toFixed(2);

      // Probability density calculation
      const p00 = Math.round(Math.pow(Math.cos(theta / 2), 2) * 100);
      const p01 = Math.round(Math.pow(Math.sin(theta / 2), 2) * 100);

      const applyPreset = (q, t, p) => {
        setQubits(q);
        setTheta(t);
        setPhi(p);
      };

      const handleRunModel = () => {
        setIsRunning(true);
        setActiveStep(1);

        setTimeout(() => setActiveStep(2), 250);
        setTimeout(() => setActiveStep(3), 500);
        setTimeout(() => setActiveStep(4), 750);
        setTimeout(() => setIsRunning(false), 1000);
      };

      return (
        <div className="w-full min-h-screen p-4 md:p-6 max-w-7xl mx-auto space-y-6">
          
          {/* Header Bar */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/80 backdrop-blur-md border border-slate-800 p-4 rounded-xl">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-cyan-500/10 border border-cyan-500/30 rounded-lg">
                <i data-lucide="zap" className="w-6 h-6 text-cyan-400"></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg font-bold tracking-wide text-white">QuantEngine SaaS</h1>
                  <span className="text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                    PRO SUBSCRIBER
                  </span>
                </div>
                <p className="text-xs text-slate-400">United Kingdom Central • Live Production Node</p>
              </div>
            </div>

            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
              <button 
                onClick={() => setActiveTab('sandbox')}
                className={`px-3 py-1.5 rounded-md font-medium transition-all ${activeTab === 'sandbox' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Testing Sandbox
              </button>
              <button 
                onClick={() => setActiveTab('api')}
                className={`px-3 py-1.5 rounded-md font-medium transition-all ${activeTab === 'api' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'text-slate-400 hover:text-slate-200'}`}
              >
                API Executor
              </button>
            </div>

            <div className="flex items-center gap-4 text-xs">
              <div className="text-right">
                <span className="text-slate-400 block">Q-Credits</span>
                <span className="font-mono text-cyan-400 font-bold">4,850 Left</span>
              </div>
              <div className="h-8 w-px bg-slate-800" />
              <div className="text-right">
                <span className="text-slate-400 block">Quantum Latency</span>
                <span className="font-mono text-emerald-400 font-bold">31ms (Constant)</span>
              </div>
            </div>
          </header>

          {/* Preset Shortcuts */}
          <section className="flex flex-wrap items-center gap-2 text-xs">
            <span className="text-slate-400 font-semibold uppercase text-[10px] tracking-wider mr-2">Workload Presets:</span>
            <button 
              onClick={() => applyPreset(64, 0.41, 0.85)} 
              className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/40 rounded-lg text-slate-300 transition-all"
            >
              📈 Financial Risk Portfolio
            </button>
            <button 
              onClick={() => applyPreset(32, 1.12, 1.57)} 
              className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-purple-500/40 rounded-lg text-slate-300 transition-all"
            >
              🧬 Molecular Ground State
            </button>
            <button 
              onClick={() => applyPreset(48, 0.78, 2.30)} 
              className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-emerald-500/40 rounded-lg text-slate-300 transition-all"
            >
              🚚 Supply Chain Routing
            </button>
          </section>

          {/* Interactive Quantum Circuit Gate Diagram */}
          <section className="bg-slate-900/40 border border-slate-800 rounded-xl p-4">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <i data-lucide="activity" className="w-4 h-4 text-purple-400"></i> Interactive Quantum Circuit Gate Sequence
              </h2>
              <span className="text-xs font-mono text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded border border-purple-500/20">
                Coherence Fidelity: 99.98%
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              {[
                { id: 1, gate: '|0⟩^{\\otimes N}', name: 'State Prep', desc: 'Sparse Initialization' },
                { id: 2, gate: 'Ry(θ) Rz(ϕ)', name: 'Phase U-Gate', desc: 'Custom Transformation' },
                { id: 3, gate: 'ZNE Guard', name: 'Noise Mitigation', desc: 'Error Cancellation' },
                { id: 4, gate: 'Measure', name: 'Wave Collapse', desc: 'Sub-35ms Solve' }
              ].map((step) => {
                const isActive = activeStep === step.id || isRunning;
                return (
                  <div 
                    key={step.id} 
                    className={`p-3 rounded-lg border transition-all ${
                      isActive 
                        ? 'bg-cyan-950/40 border-cyan-500/50 shadow-lg shadow-cyan-500/10' 
                        : 'bg-slate-950/60 border-slate-800/80'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-bold text-slate-300">[{step.id}] {step.name}</span>
                      <span className="font-mono text-[10px] text-cyan-400 bg-cyan-500/10 px-1.5 py-0.5 rounded">{step.gate}</span>
                    </div>
                    <p className="text-[11px] font-mono text-slate-400">{step.desc}</p>
                  </div>
                );
              })}
            </div>
          </section>

          {/* Main Execution Comparison */}
          {activeTab === 'sandbox' ? (
            <section className="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              {/* Classical CPU Panel */}
              <div className="bg-gradient-to-b from-rose-950/20 to-slate-900/60 border border-rose-900/40 rounded-xl p-5 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                      <i data-lucide="cpu" className="w-5 h-5 text-rose-500"></i>
                      <h3 className="font-semibold text-rose-200">Engine 1: Standard CPU (Classical)</h3>
                    </div>
                    <span className="text-xs font-mono text-rose-400 bg-rose-500/10 border border-rose-500/30 px-2 py-1 rounded flex items-center gap-1">
                      <i data-lucide="alert-triangle" className="w-3 h-3"></i> HARDWARE TIMEOUT
                    </span>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div className="p-3 bg-slate-950/80 rounded-lg border border-rose-900/30 font-mono">
                      <div className="text-slate-400 mb-1">Execution Architecture:</div>
                      <div className="text-rose-400 font-bold">Serial $O(2^N)$ Matrix Inversion Loop</div>
                      <div className="text-slate-500 text-[10px] mt-1">Iteration: 1,000,000 / {formattedStates}</div>
                    </div>

                    <div className="space-y-1">
                      <div className="flex justify-between text-slate-400">
                        <span>Core Thread Saturation</span>
                        <span className="text-rose-400 font-bold">100% Pinned</span>
                      </div>
                      <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-rose-900/30">
                        <div className="bg-rose-500 h-full w-full animate-pulse" />
                      </div>
                    </div>

                    <div className="p-3 bg-slate-950/60 rounded-lg border border-slate-800">
                      <span className="text-slate-400 block mb-1">Estimated Completion Time:</span>
                      <span className="text-xl font-bold text-rose-400 font-mono">~15.2 Days</span>
                    </div>
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-rose-900/20 text-[11px] text-slate-500 flex justify-between items-center">
                  <span>Status: Stalled at max memory threshold</span>
                  <span className="text-rose-400 font-mono">0.000001% Progress</span>
                </div>
              </div>

              {/* Proprietary Quantum Backend Panel */}
              <div className="bg-gradient-to-b from-cyan-950/20 to-slate-900/60 border border-cyan-500/40 rounded-xl p-5 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                      <i data-lucide="zap" className="w-5 h-5 text-cyan-400"></i>
                      <h3 className="font-semibold text-cyan-100">Engine 2: Proprietary Quantum Model</h3>
                    </div>
                    <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-1 rounded flex items-center gap-1">
                      <i data-lucide="check-circle-2" className="w-3 h-3"></i> COMPUTE COMPLETE
                    </span>
                  </div>

                  <div className="space-y-4 text-xs">
                    {/* Live Math Inspector */}
                    <div className="p-3 bg-slate-950/80 rounded-lg border border-cyan-500/30 font-mono">
                      <div className="text-slate-400 mb-1">Solved Output State Vector $|\Psi_{\text{final}}\rangle$:</div>
                      <div className="text-amber-300 font-bold text-sm tracking-wide">
                        {c00}|00⟩ + {c01}|01⟩ + e^(i{phaseExp})0.11|10⟩
                      </div>
                      <div className="text-slate-400 text-[10px] mt-2 flex justify-between">
                        <span>$c_{00} = \cos(\theta/2) = {c00}$</span>
                        <span>$c_{01} = \sin(\theta/2) = {c01}$</span>
                      </div>
                    </div>

                    {/* Live State Probability Density Bars */}
                    <div className="space-y-2 p-3 bg-slate-950/60 rounded-lg border border-slate-800">
                      <div className="text-[11px] text-slate-400 font-semibold mb-1">State Probability Amplitudes:</div>
                      <div>
                        <div className="flex justify-between text-[10px] text-slate-400 mb-0.5">
                          <span>$|00\rangle$ Ground State</span>
                          <span className="font-mono text-cyan-400">{p00}%</span>
                        </div>
                        <div className="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                          <div className="bg-cyan-400 h-full transition-all duration-300" style={{ width: `${p00}%` }}></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between text-[10px] text-slate-400 mb-0.5">
                          <span>$|01\rangle$ Excited State</span>
                          <span className="font-mono text-purple-400">{p01}%</span>
                        </div>
                        <div className="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                          <div className="bg-purple-400 h-full transition-all duration-300" style={{ width: `${p01}%` }}></div>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="p-3 bg-slate-950/60 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block mb-1">Quantum Execution:</span>
                        <span className="text-xl font-bold text-emerald-400 font-mono">31ms</span>
                      </div>
                      <div className="p-3 bg-slate-950/60 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block mb-1">State Space Size:</span>
                        <span className="text-xl font-bold text-cyan-400 font-mono">{formattedStates}</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-cyan-900/30 text-[11px] text-slate-400 flex justify-between items-center">
                  <span>Coherence Layer: Active mitigation</span>
                  <span className="text-emerald-400 font-mono font-bold">Speedup: 422,580,645x</span>
                </div>
              </div>

            </section>
          ) : (
            /* API Integration Code Block */
            <section className="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-sm font-semibold text-purple-300 flex items-center gap-2">
                  <i data-lucide="code" className="w-4 h-4"></i> Production API Integration Code
                </h3>
                <span className="text-xs text-slate-400">Endpoint: https://api.quantengine.uk/v4/solve</span>
              </div>
              <pre className="p-4 bg-slate-950 rounded-lg border border-slate-800 font-mono text-xs text-cyan-300 overflow-x-auto">
{`import quantengine as qe

# Initialize UK Production Client
client = qe.Client(api_key="qe_uk_live_0034", region="uk-central")

# Configure Matrix Execution Parameters
matrix_spec = {
    "qubits": ${qubits},
    "polar_angle": ${theta},
    "azimuthal_angle": ${phi},
    "error_mitigation": True
}

# Execute Sub-35ms Quantum State Solve
result = client.solve_state(matrix_spec)
print(f"Solved State: {result.state_vector}")
print(f"Latency: {result.execution_ms}ms")`}
              </pre>
            </section>
          )}

          {/* Parameter Controls Dock */}
          <footer className="bg-slate-900/80 border border-slate-800 p-5 rounded-xl flex flex-col md:flex-row items-center justify-between gap-6">
            
            <div className="w-full md:w-2/3 grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>Qubit Complexity Scale</span>
                  <span className="text-cyan-400 font-mono font-bold">{qubits} Qubits</span>
                </div>
                <input 
                  type="range" 
                  min="16" 
                  max="64" 
                  value={qubits} 
                  onChange={(e) => setQubits(Number(e.target.value))}
                  className="w-full accent-cyan-400 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>Polar Angle (θ)</span>
                  <span className="text-cyan-400 font-mono font-bold">{theta}</span>
                </div>
                <input 
                  type="range" 
                  min="0" 
                  max="1.57" 
                  step="0.01" 
                  value={theta} 
                  onChange={(e) => setTheta(Number(e.target.value))}
                  className="w-full accent-cyan-400 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>Azimuthal Angle (ϕ)</span>
                  <span className="text-cyan-400 font-mono font-bold">{phi}</span>
                </div>
                <input 
                  type="range" 
                  min="0" 
                  max="3.14" 
                  step="0.01" 
                  value={phi} 
                  onChange={(e) => setPhi(Number(e.target.value))}
                  className="w-full accent-cyan-400 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                />
              </div>
            </div>

            <div className="flex items-center gap-3 w-full md:w-auto">
              <button 
                onClick={handleRunModel}
                disabled={isRunning}
                className="flex-1 md:flex-none px-6 py-2.5 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-semibold text-xs rounded-lg shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
              >
                {isRunning ? (
                  <i data-lucide="refresh-cw" className="w-4 h-4 animate-spin"></i>
                ) : (
                  <i data-lucide="play" className="w-4 h-4 fill-white"></i>
                )}
                {isRunning ? 'Evolving State...' : 'EXECUTE MODEL'}
              </button>
            </div>
          </footer>

        </div>
      );
    }

    // Render React App safely
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<QuantEnginePortal />);
  </script>
</body>
</html>
