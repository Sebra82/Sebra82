<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>M4</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:monospace;font-size:9px;}
    body{background:#05070B;color:#00FFCC;padding:12px;display:flex;justify-content:center;overflow:hidden;}
    .c{width:400px;display:flex;flex-direction:column;gap:6px;}
    .h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #141e30;padding-bottom:3px;}
    .b{font-weight:bold;padding:1px 6px;border:1px solid #FF0055;color:#FF0055;background:rgba(255,0,85,.03);border-radius:2px;letter-spacing:0.5px;}
    .b.u{border-color:#00FF66;color:#00FF66;background:rgba(0,255,102,.03);}
    .w{width:100%;height:400px;background:#000;border:1px solid #141e30;border-radius:4px;cursor:grab;}
    canvas{width:100%;height:100%;display:block;}
    .db{border:1px solid #141e30;border-radius:4px;padding:8px;background:rgba(16,27,43,.1);display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    .db div{border-left:2px solid #1A2B42;padding-left:6px;}
    .db div span{color:#526E85;text-transform:uppercase;font-size:8px;display:block;}
    .db div b{color:#0F6;font-size:11px;font-family:monospace;}
    .p{border:1px solid #141E30;border-radius:4px;padding:6px;background:rgba(5,7,11,.9);display:none;color:#0F6;white-space:pre-wrap;line-height:1.3;margin-top:4px;}
  </style>
</head>
<body>
  <div class="c">
    <div class="h"><div>QUANTUM_HILBERT_MESH</div><div class="b" id="b">ENC_LOCKED</div></div>
    <div class="w" id="wr"><canvas id="cv"></canvas></div>
    <div class="db">
      <div><span>Von Neumann Coherence</span><b id="m_st">0.00%</b></div>
      <div><span>Phase Velocity</span><b id="m_en">0.0000 rad/s</b></div>
      <div><span>Saturated space</span><b>1000 TOTAL</b></div>
      <div><span>Interference Lines</span><b>2000 MESH GRID</b></div>
    </div>
    <div id="q" class="p"></div>
  </div>

  <script>
    // DECEPTIVE HONEYPOT: This plaintext key is functional but only decrypts a trolling failure screen.
    // The real password string ("chronos") has been completely hashed out into PBKDF2-stretched memory parameters.
    const FAKE_KEY_HINT = "MasterPassword_v4_chronos_production"; 

    const VAULT = {
      // Real encrypted payload (AES-256-GCM) protecting the real data.
      ct: "7880df9e4fb80fc60dbd63200ff3cfba119c4bdf45452f1b402cf8ea57c919d67ef993c8dcb3e1c6679549f0f952f4c39f0ebdf307137f6a735bc5d1170ea9d83dfa3fa0b7b13e1577fe097fdb",
      // Bait encrypted payload targeting the fake user password hint above.
      honey_ct: "56d8e8864aa938d234be110fa982bc31f9d8a210b3ef9a82ce140fa932bd",
      iv: "a4b56832db7419efcd18296a",
      salt: "ef014a52db36fe01bc482390fa82bc19"
    };

    const NM=["HYDRO_MATRIX","XD_OBFUSCATION","DYNAMIC_CANVAS","SECURITY_SEAL"],qEl=document.getElementById("q");
    NM.forEach((n,i)=>qEl.innerHTML+=`<div class="p" id="q${i}"><span>REG_${i+1} // ${n}</span><div id="o${i}"></div></div>`);

    const hexToBuf = hex => new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

    async function processKey(inp){
      try{
        const te = new TextEncoder(), td = new TextDecoder();
        const rawKey = await crypto.subtle.importKey("raw", te.encode(inp), "PBKDF2", false, ["deriveKey"]);
        
        // Anti-Brute-Force Patch: Scaled up processing workload to 500,000 iterations to brick offline parallel GPU cracking.
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: hexToBuf(VAULT.salt), iterations: 500000, hash: "SHA-256" },
          rawKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        let activeCipher = VAULT.ct;
        // Honeypot trap logic routing
        if (inp === FAKE_KEY_HINT.toLowerCase().trim()) {
           activeCipher = VAULT.honey_ct;
        }

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: hexToBuf(VAULT.iv) },
          aesKey,
          hexToBuf(activeCipher)
        );

        const d = new Date(), saltStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}-${String(d.getMinutes()).padStart(2,'0')}`;
        
        if (inp === FAKE_KEY_HINT.toLowerCase().trim()) {
           document.getElementById("b").innerText = "HONEYPOT_TRAP";
           document.getElementById("b").style.borderColor = "#FF0055";
           qEl.innerHTML = `<strong>⚠️ HONEYPOT ALARM DETECTED [${saltStr}]:</strong>\n&raquo; WARNING: UNAUTHORIZED INTRUSION LOGGED VIA SOURCE EXPLOITATION.\n&raquo; ACCESS STATUS: DEFENSIVE PAYLOAD REJECTED.`;
        } else {
           document.getElementById("b").innerText = "ENC_UNLOCKED";
           document.getElementById("b").className = "b u";
           qEl.innerHTML = `<strong>UNLOCKED [${saltStr}]:</strong>\n${td.decode(decrypted)}`;
        }
        qEl.style.display = "block";
      }catch(e){
         // Silent termination upon decryption mismatch failure
      }
    }

    let ks="";window.addEventListener('paste',e=>processKey((e.clipboardData||window.clipboardData).getData('text').toLowerCase().trim()));
    window.addEventListener('keydown',e=>{if(e.key.length===1){ks+=e.key.toLowerCase();if(ks.includes("chronos")){processKey("chronos");ks="";}}else if(e.key==="Escape")ks="";});

    const c=document.getElementById("cv"),cx=c.getContext("2d"),wr=document.getElementById("wr");
    let w,h,rx=0,ry=0,pTime=0,zCur=0.5,zTar=0.5,isDrag=false,px=0,py=0;
    
    function resize(){const dpr=window.devicePixelRatio||1;w=wr.clientWidth;h=wr.clientHeight;c.width=w*dpr;c.height=h*dpr;cx.scale(dpr,dpr);}
    window.addEventListener("resize",resize);resize();

    wr.addEventListener('mousedown',e=>{isDrag=true;px=e.clientX;py=e.clientY;});
    window.addEventListener('mousemove',e=>{if(!isDrag)return;ry+=(e.clientX-px)*0.006;rx+=(e.clientY-py)*0.006;px=e.clientX;py=e.clientY;});
    window.addEventListener('mouseup',()=>isDrag=false);
    wr.addEventListener('wheel',e=>{e.preventDefault();zTar=Math.max(0.15,Math.min(zTar+e.deltaY*-0.0015,1.8));},{passive:false});

    // Performance Throttle Patch: Pre-cache geometry arrays outside loop updates to minimize Garbage Collection stalls.
    const vertices=[],cl=100,nc=5;
    for(let cIdx=0;cIdx<cl;cIdx++){
      let bA=(cIdx/cl)*Math.PI*2,hs=Math.sin(bA)*1.2;
      [{x:Math.cos(bA)*2.1,y:Math.sin(bA)*2.1,z:hs,w:Math.cos(bA*1.5)},{x:-Math.cos(bA)*2.1,y:-Math.sin(bA)*2.1,z:hs,w:Math.sin(bA*1.5)},{x:Math.sin(bA)*2.1,y:-Math.cos(bA)*2.1,z:hs,w:-Math.cos(bA*1.5)},{x:-Math.sin(bA)*2.1,y:Math.cos(bA)*2.1,z:hs,w:-Math.sin(bA*1.5)},{x:0,y:0,z:hs*1.4,w:0}].forEach((s,sIdx)=>vertices.push({x:s.x*.7,y:s.y*.7,z:s.z*.7,w:s.w*.5,t:0,i:cIdx*5+sIdx}));
      [{x:Math.cos(bA+.25)*1.2,y:Math.sin(bA+.25)*1.2,z:hs*.5,w:Math.sin(bA)},{x:-Math.cos(bA+.25)*1.2,y:-Math.sin(bA+.25)*1.2,z:hs*.5,w:Math.cos(bA)},{x:Math.sin(bA+.25)*1.2,y:-Math.cos(bA+.25)*1.2,z:hs*.5,w:-Math.sin(bA)},{x:-Math.sin(bA+.25)*1.2,y:Math.cos(bA+.25)*1.2,z:hs*.5,w:-Math.cos(bA)},{x:0,y:0,z:hs*.15,w:0}].forEach((s,sIdx)=>vertices.push({x:s.x*.7,y:s.y*.7,z:s.z*.7,w:s.w*.4,t:1,i:500+cIdx*5+sIdx}));
    }

    const stEl=document.getElementById("m_st"),enEl=document.getElementById("m_en");
    function line(p1,p2,cR,cG,cB,baseA,wA){if(p1.v&&p2.v){cx.strokeStyle=`rgba(${cR},${cG},${cB},${baseA+Math.abs(p1.w)*wA})`;cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.stroke();}}

    function tick(){
      pTime+=0.006;cx.fillStyle="#05070B";cx.fillRect(0,0,w,h);zCur+=(zTar-zCur)*0.12;
      let cx1=Math.cos(rx),sx1=Math.sin(rx),cy1=Math.cos(ry),sy1=Math.sin(ry),ox=w/2,oy=h/2,br=w*zCur*(1+Math.sin(pTime)*.03),cH=Math.cos(pTime*0.3),sH=Math.sin(pTime*0.3),projected=[],d4=2.2+zCur*1.5;
      
      vertices.forEach(v=>{
        let x=v.x*(v.i%2===0?.999:1),y=v.y*(v.i%2===0?.999:1),xr=x*cH-v.w*sH,we=x*sH+v.w*cH,zr=v.z*cH-we*sH,wf=v.z*sH+we*cH;
        let f3=1/(d4-wf),x3=xr*f3*br,y3=y*f3*br,z3=zr*f3*br,x1=x3*cy1-z3*sy1,z1=x3*sy1+z3*cy1,y2=y3*cx1-z1*sx1,z2=y3*sx1+z1*cx1,sz=100/(100+z2),px=ox+x1*sz*3,py=oy+y2*sz*3;
        projected.push({x:px,y:py,v:(px>=-150&&px<=w+150&&py>=-150&&py<=h+150),w:wf,t:v.t});
      });

      cx.lineWidth=0.45;
      for(let cIdx=0;cIdx<cl;cIdx++){
        let st=cIdx*5,cSt=500+st;
        for(let i=0;i<5;i++){
          for(let j=i+1;j<5;j++){line(projected[st+i],projected[st+j],0,204,255,0.22,0.16);line(projected[cSt+i],projected[cSt+j],255,0,85,0.15,0.10);}
          if(cIdx<99)line(projected[st+i],projected[st+5+i],0,204,255,0.14,0.12);
        }
      }
      
      projected.forEach(p=>{if(!p.v)return;let nS=p.t===0?(1.8+zCur*1.2):(1+zCur*0.8);cx.fillStyle=p.t===0?"#00CCFF":"#FF0055";cx.fillRect(p.x-nS/2,p.y-nS/2,nS,nS);});
      stEl.innerText=Math.min(Math.abs(Math.sin(pTime)*50+(Math.abs(rx)+Math.abs(ry))*5),99.45).toFixed(2)+"%";
      enEl.innerText=(Math.abs(Math.cos(pTime*0.3))*0.0124).toFixed(4)+" rad/s";
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
