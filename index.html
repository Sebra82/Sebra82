<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEBRA82 v45.0 - Secure Terminal Client</title>
  <style>
    :root {
      --bg-deep: #020408;
      --card-bg: rgba(7, 11, 19, 0.99);
      --border-color: rgba(0, 243, 255, 0.35);
      --neon-cyan: #00f3ff;
      --crimson-red: #ff3344;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-green: #7ee787;
      --font-mono: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0.5rem; }
    
    #gatewayPortal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999;
      background: radial-gradient(circle at center, #0a1128 0%, #010307 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; gap: 1rem;
    }
    #gatewayPortal.hidden { display: none; }
    .gateway-card {
      background: rgba(10, 14, 22, 0.98); border: 1px solid var(--neon-cyan); border-radius: 12px;
      padding: 1.8rem; max-width: 400px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 1rem;
    }
    .gateway-input { width: 100%; background: #1e2a40; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.8rem; color: #fff; font-size: 0.9rem; text-align: center; outline: none; }
    .gateway-btn { width: 100%; padding: 0.8rem; font-weight: bold; background: rgba(0, 243, 255, 0.15); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    
    .platform-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; max-width: 800px; width: 100%; height: 90vh; display: flex; flex-direction: column; gap: 1rem; }
    .canvas-box { position: relative; width: 100%; flex: 1; background: #000; border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.4); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; top: 6px; left: 8px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--neon-cyan); background: rgba(0,0,0,0.8); padding: 3px 6px; border-radius: 4px; }
  </style>
</head>
<body>

<!-- Gateway Authentication -->
<div id="gatewayPortal">
  <div class="gateway-card">
    <h2 style="color: #fff; font-family: var(--font-mono);">⚡ SEBRA82 TERMINAL</h2>
    <p style="color: var(--text-muted); font-size: 0.8rem;">Enter password <strong>Quantum</strong> for secure demo sandbox.</p>
    <input type="password" id="passInput" class="gateway-input" placeholder="Enter Password..." value="Quantum">
    <button class="gateway-btn" onclick="connectToServer()">Connect to Python Engine</button>
    <div id="errorMsg" style="color: var(--crimson-red); font-size: 0.75rem;"></div>
  </div>
</div>

<!-- Main UI Dashboard -->
<div class="platform-container" id="mainContainer" style="display:none;">
  <div style="font-family: var(--font-mono); color: var(--neon-cyan); font-weight: bold;">
    🔗 SECURE TELEMETRY LINK: <span id="connectionStatus" style="color: var(--accent-green);">Connected</span>
  </div>
  <div class="canvas-box">
    <div class="hud" id="hudTick">Tick: 0 | Value: 0.00</div>
    <canvas id="liveCanvas" width="600" height="300"></canvas>
  </div>
</div>

<script>
  let socket = null;
  const canvas = document.getElementById('liveCanvas');
  const ctx = canvas.getContext('2d');
  let waveBuffer = new Array(150).fill(50);

  async function connectToServer() {
    const pass = document.getElementById('passInput').value.trim();
    if (!pass) return;

    // Connect to the Python background server we just set up on port 8766
    // Note: For raw TCP sockets in browser, standard WebSocket requires ws:// protocol.
    // Ensure your Python server matches protocol type.
    try {
      socket = new WebSocket("ws://127.0.0.1:8766");
      
      socket.onopen = () => {
        // Send handshake credentials to Python backend
        const payload = {
          hash: pass === "Quantum" ? "" : pass,
          is_decoy: (pass === "Quantum")
        };
        socket.send(JSON.stringify(payload));

        // Hide gateway, show dashboard
        document.getElementById('gatewayPortal').classList.add('hidden');
        document.getElementById('mainContainer').style.display = 'flex';
        startRenderLoop();
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        waveBuffer.shift();
        waveBuffer.push(data.value);
        document.getElementById('hudTick').innerText = `Tick: ${data.tick} | Value: ${data.value.toFixed(2)}`;
      };

      socket.onerror = (err) => {
        document.getElementById('errorMsg').innerText = "Connection failed. Ensure Python server is running on port 8766.";
      };
    } catch(e) {
      document.getElementById('errorMsg').innerText = "Error establishing socket connection.";
    }
  }

  function startRenderLoop() {
    function render() {
      ctx.fillStyle = '#020408';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      let step = canvas.width / Math.max(1, waveBuffer.length - 1);
      waveBuffer.forEach((val, idx) => {
        let x = idx * step;
        let y = canvas.height - (val / 100) * canvas.height;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      requestAnimationFrame(render);
    }
    render();
  }
</script>

</body>
</html>
