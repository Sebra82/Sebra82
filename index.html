<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantEngine SaaS — Quantum Model Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX Compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02040a;
      color: #f1f5f9;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden antialiased select-none p-2">

  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function QuantumCanvas({ theta, phi, isRunning }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let t = 0;

        const render = () => {
          t += isRunning ? 0.09 : 0.025;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const width = canvas.width;
          const height = canvas.height;
          const centerY = height / 2;

          // Primary Wave (|00> State Amplitude)
          ctx.beginPath();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#00F2FE';
          for (let x = 0; x < width; x++) {
            const amplitude = Math.sin(theta) * 16 + 6;
            const frequency = 0.035 + phi * 0.008;
            const y = centerY + Math.sin(x * frequency + t) * amplitude * Math.cos(x * 0.012 + t * 0.6);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Secondary Wave (|01> State Phase Shift)
          ctx.beginPath();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#A855F7';
          for (let x = 0; x < width; x++) {
            const amplitude = Math.cos(theta) * 14 + 5;
            const frequency = 0.028;
            const y = centerY + Math.cos(x * frequency - t * 1.3) * amplitude;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => cancelAnimationFrame(animationFrameId);
      }, [theta, phi, isRunning]);

      return <canvas ref={canvasRef} width={600} height={60} className="w-full h-full rounded bg-slate-950/90 border border-slate-800" />;
    }

    function QuantEnginePortal() {
      const [qubits, setQubits] = useState(64);
      const [theta, setTheta] = useState(0.41);
      const [phi, setPhi] = useState(0.85);
      const [isRunning, setIsRunning] = useState(false);
      const [activeStep, setActiveStep] = useState(1);
      const [calcPulse, setCalcPulse] = useState(0);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeStep, isRunning]);

      useEffect(() => {
        const interval = setInterval(() => {
          setCalcPulse((prev) => (prev + 1) % 100);
        }, 70);
        return () => clearInterval(interval);
      }, []);

      const totalStates = Math.pow(2, qubits);
      const formattedStates = totalStates > 1e12 
        ? (totalStates / 1e18).toFixed(1) + ' Quintillion' 
        : totalStates.toLocaleString();

      const dynamicPhaseShift = (phi + calcPulse * 0.004).toFixed(2);
      const c00 = Math.cos(theta / 2).toFixed(3);
      const c01 = Math.sin(theta / 2).toFixed(3);

      const p00 = Math.round(Math.pow(Math.cos(theta / 2), 2) * 100);
      const p01 = Math.round(Math.pow(Math.sin(theta / 2), 2) * 100);

      const applyPreset = (q, t, p) => {
        setQubits(q);
        setTheta(t);
        setPhi(p);
      };

      const handleRunModel = () => {
        setIsRunning(true);
        setActiveStep(1);
        setTimeout(() => setActiveStep(2), 180);
        setTimeout(() => setActiveStep(3), 360);
        setTimeout(() => setActiveStep(4), 540);
        setTimeout(() => setIsRunning(false), 720);
      };

      return (
        <div className="h-full w-full flex flex-col justify-between gap-1.5 max-w-7xl mx-auto">
          
          {/* Header */}
          <header className="flex items-center justify-between bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-lg text-xs shrink-0">
            <div className="flex items-center gap-2">
              <div className="p-1 bg-cyan-500/10 border border-cyan-500/30 rounded">
                <i data-lucide="zap" className="w-4 h-4 text-cyan-400"></i>
              </div>
              <span className="font-bold text-white tracking-wide">QuantEngine SaaS</span>
              <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">
                UK CENTRAL • 31ms
              </span>
            </div>

            <div className="flex items-center gap-3 text-[11px] font-mono text-slate-400">
              <span>Presets:</span>
              <button onClick={() => applyPreset(64, 0.41, 0.85)} className="px-2 py-0.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">
                📈 Portfolio
              </button>
              <button onClick={() => applyPreset(32, 1.12, 1.57)} className="px-2 py-0.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">
                🧬 Molecular
              </button>
              <button onClick={() => applyPreset(48, 0.78, 2.30)} className="px-2 py-0.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">
                🚚 Logistics
              </button>
            </div>
          </header>

          {/* Circuit Pipeline Sequence */}
          <div className="grid grid-cols-4 gap-2 text-[11px] shrink-0">
            {[
              { id: 1, gate: '|0⟩^N', name: 'State Prep', desc: 'Sparse Init' },
              { id: 2, gate: 'Ry(θ) Rz(ϕ)', name: 'Phase U-Gate', desc: 'Transformation' },
              { id: 3, gate: 'ZNE Guard', name: 'Mitigation', desc: 'Error Cancel' },
              { id: 4, gate: 'Measure', name: 'Wave Collapse', desc: 'Sub-35ms' }
            ].map((step) => (
              <div 
                key={step.id} 
                className={`p-1.5 rounded border transition-all ${
                  activeStep === step.id || isRunning
                    ? 'bg-cyan-950/40 border-cyan-500/60 shadow-md shadow-cyan-500/10'
                    : 'bg-slate-950/60 border-slate-800'
                }`}
              >
                <div className="flex justify-between items-center">
                  <span className="font-bold text-slate-300">[{step.id}] {step.name}</span>
                  <span className="font-mono text-[9px] text-cyan-400 bg-cyan-500/10 px-1 rounded">{step.gate}</span>
                </div>
                <p className="text-[10px] font-mono text-slate-400">{step.desc}</p>
              </div>
            ))}
          </div>

          {/* Animated Quantum Wave Visualizer */}
          <div className="bg-slate-900/40 border border-slate-800 rounded-lg p-1.5 flex flex-col justify-between h-20 shrink-0">
            <div className="flex justify-between items-center text-[10px] font-mono mb-1">
              <span className="text-slate-400 flex items-center gap-1">
                <i data-lucide="activity" className="w-3 h-3 text-cyan-400"></i> Live Amplitude Wave Superposition
              </span>
              <span className="text-cyan-400">e^(i{dynamicPhaseShift}) Phase Shift</span>
            </div>
            <div className="flex-1 min-h-0">
              <QuantumCanvas theta={theta} phi={phi} isRunning={isRunning} />
            </div>
          </div>

          {/* Main Side-by-Side Dual Engine Comparison */}
          <div className="grid grid-cols-2 gap-2 flex-1 min-h-0">
            
            {/* Classical CPU */}
            <div className="bg-rose-950/20 border border-rose-900/40 rounded-lg p-2.5 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <span className="font-bold text-rose-300 text-xs flex items-center gap-1">
                    <i data-lucide="cpu" className="w-3.5 h-3.5 text-rose-500"></i> Standard Classical CPU
                  </span>
                  <span className="text-[9px] font-mono text-rose-400 bg-rose-500/10 border border-rose-500/30 px-1.5 py-0.5 rounded">
                    TIMEOUT
                  </span>
                </div>

                <div className="space-y-2 font-mono text-[11px]">
                  <div className="p-2 bg-slate-950/90 rounded border border-rose-900/30">
                    <div className="text-slate-500 text-[10px]">Matrix Loop Saturation:</div>
                    <div className="text-rose-400 font-bold">Serial O(2^N) Inversion</div>
                    <div className="text-slate-400 text-[10px]">Iter: {(calcPulse * 2048).toLocaleString()} / {formattedStates}</div>
                  </div>

                  <div className="p-2 bg-slate-950/60 rounded border border-slate-800">
                    <span className="text-slate-400 text-[10px] block">Est. Completion:</span>
                    <span className="text-base font-bold text-rose-400">~15.2 Days</span>
                  </div>
                </div>
              </div>

              <div className="text-[10px] font-mono text-slate-500 border-t border-rose-900/20 pt-1 flex justify-between">
                <span>Thread Load: 100% Core Saturation</span>
                <span className="text-rose-400 font-bold">0.0001%</span>
              </div>
            </div>

            {/* Quantum Model Engine */}
            <div className="bg-cyan-950/20 border border-cyan-500/40 rounded-lg p-2.5 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <span className="font-bold text-cyan-200 text-xs flex items-center gap-1">
                    <i data-lucide="zap" className="w-3.5 h-3.5 text-cyan-400"></i> Proprietary Quantum Model
                  </span>
                  <span className="text-[9px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-1.5 py-0.5 rounded">
                    COMPLETE (31ms)
                  </span>
                </div>

                <div className="space-y-2">
                  <div className="p-2 bg-slate-950/90 rounded border border-cyan-500/30 font-mono text-[11px]">
                    <div className="text-slate-400 text-[10px]">Solved Wave State |Ψ⟩:</div>
                    <div className="text-amber-300 font-bold text-xs truncate">
                      {c00}|00⟩ + {c01}|01⟩ + e^(i{dynamicPhaseShift})0.11|10⟩
                    </div>
                    <div className="text-slate-400 text-[10px] mt-1 flex justify-between border-t border-slate-800 pt-1">
                      <span>c00 = {c00}</span>
                      <span>c01 = {c01}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-[10px] font-mono">
                    <div className="p-1.5 bg-slate-950/60 rounded border border-slate-800">
                      <div className="flex justify-between text-slate-400 mb-0.5">
                        <span>|00⟩ Ground</span>
                        <span className="text-cyan-400">{p00}%</span>
                      </div>
                      <div className="w-full bg-slate-900 h-1 rounded overflow-hidden">
                        <div className="bg-cyan-400 h-full transition-all duration-150" style={{ width: `${p00}%` }}></div>
                      </div>
                    </div>
                    <div className="p-1.5 bg-slate-950/60 rounded border border-slate-800">
                      <div className="flex justify-between text-slate-400 mb-0.5">
                        <span>|01⟩ Excited</span>
                        <span className="text-purple-400">{p01}%</span>
                      </div>
                      <div className="w-full bg-slate-900 h-1 rounded overflow-hidden">
                        <div className="bg-purple-400 h-full transition-all duration-150" style={{ width: `${p01}%` }}></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="text-[10px] font-mono text-emerald-400 border-t border-cyan-900/30 pt-1 flex justify-between">
                <span>Speedup: 422,580,645x</span>
                <span className="font-bold">Sub-35ms Wave Collapse</span>
              </div>
            </div>

          </div>

          {/* Bottom Control Dock */}
          <footer className="bg-slate-900/90 border border-slate-800 p-2.5 rounded-lg flex items-center justify-between gap-3 shrink-0">
            <div className="grid grid-cols-3 gap-3 flex-1 text-xs">
              <div>
                <div className="flex justify-between text-slate-400 text-[10px] mb-0.5 font-mono">
                  <span>Qubit Scale</span>
                  <span className="text-cyan-400 font-bold">{qubits} Qubits</span>
                </div>
                <input type="range" min="16" max="64" value={qubits} onChange={(e) => setQubits(Number(e.target.value))} className="w-full accent-cyan-400 h-1 bg-slate-800 rounded cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between text-slate-400 text-[10px] mb-0.5 font-mono">
                  <span>Polar Angle (θ)</span>
                  <span className="text-cyan-400 font-bold">{theta}</span>
                </div>
                <input type="range" min="0" max="1.57" step="0.01" value={theta} onChange={(e) => setTheta(Number(e.target.value))} className="w-full accent-cyan-400 h-1 bg-slate-800 rounded cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between text-slate-400 text-[10px] mb-0.5 font-mono">
                  <span>Azimuthal Angle (ϕ)</span>
                  <span className="text-cyan-400 font-bold">{phi}</span>
                </div>
                <input type="range" min="0" max="3.14" step="0.01" value={phi} onChange={(e) => setPhi(Number(e.target.value))} className="w-full accent-cyan-400 h-1 bg-slate-800 rounded cursor-pointer" />
              </div>
            </div>

            <button 
              onClick={handleRunModel} 
              disabled={isRunning}
              className="px-5 py-2 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-semibold text-xs rounded shadow-md transition-all flex items-center gap-1.5 disabled:opacity-50 shrink-0"
            >
              {isRunning ? <i data-lucide="refresh-cw" className="w-3.5 h-3.5 animate-spin"></i> : <i data-lucide="play" className="w-3.5 h-3.5 fill-white"></i>}
              {isRunning ? 'EVOLVING...' : 'RUN MODEL'}
            </button>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<QuantEnginePortal />);
  </script>
</body>
</html>
