<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBRA82 v5.5 - Procedural Raymached Beach</title>
    <style>
        body {
            margin: 0;
            background: #010103;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(4, 4, 12, 0.9);
            padding: 16px 20px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
            z-index: 10;
            pointer-events: none;
        }
        h2 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 2px; color: #ff007f; }
        p { margin: 5px 0; font-size: 12px; display: flex; justify-content: space-between; width: 230px; }
        span.val { color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <h2>SEBRA82 COASTAL ENGINE</h2>
        <p>Render Resolution: <span class="val">320 x 240</span></p>
        <p>Harmonic Wave Mesh: <span class="val">Active</span></p>
        <p>Frame Latency: <span class="val" id="latency-display">0.00 ms</span></p>
        <p>Frame Rate: <span class="val" id="fps-display">60 FPS</span></p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = 320;
        const HEIGHT = 240;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        const imgData = ctx.createImageData(WIDTH, HEIGHT);
        const data = imgData.data;

        // Pre-computed trigonometric lookup table for zero-overhead wave mathematics
        const LUT_SIZE = 3600;
        const SIN_LUT = new Float32Array(LUT_SIZE);
        for (let i = 0; i < LUT_SIZE; i++) {
            SIN_LUT[i] = Math.sin((i * Math.PI) / 180);
        }

        let globalTick = 0;
        let lastTime = performance.now();

        function renderBeachScene() {
            let frameStart = performance.now();
            globalTick++;
            let time = globalTick * 0.04;

            let pixelIndex = 0;

            for (let y = 0; y < HEIGHT; y++) {
                // Map screen coordinates (-1 to 1)
                let ny = (y - HEIGHT / 2) / (HEIGHT / 2);

                for (let x = 0; x < WIDTH; x++) {
                    let nx = (x - WIDTH / 2) / (HEIGHT / 2);

                    let r = 20, g = 60, b = 120; // Default sky baseline

                    if (ny < 0.0) {
                        // --- SKY & SUN ATMOSPHERE ---
                        let sunDist = Math.hypot(nx - 0.3, ny + 0.3);
                        let sunGlow = Math.max(0, 1.0 - sunDist * 1.8);
                        
                        // Sunset gradient mixed with SEBRA harmonic sky waves
                        let lutIdx = Math.floor(Math.abs(nx * 300 + globalTick) % LUT_SIZE);
                        let waveBand = SIN_LUT[lutIdx] * 0.1;

                        r = Math.floor(130 + sunGlow * 125 + waveBand * 40);
                        g = Math.floor(70 + sunGlow * 140 + ny * 30);
                        b = Math.floor(140 + sunGlow * 115);

                    } else {
                        // --- OCEAN & BEACH SHORELINE LOGIC ---
                        // Use your harmonic spectrum equations to generate organic rolling waves
                        let waveParam = nx * 8.0 + time + SIN_LUT[Math.floor(Math.abs(ny * 400 + globalTick * 2) % LUT_SIZE)] * 1.5;
                        let waveHeight = Math.sin(waveParam) * 0.05;

                        if (ny < 0.3 + waveHeight) {
                            // Ocean Water (Teal to Deep Blue Gradient)
                            let depthFactor = ny / 0.3;
                            r = Math.floor(10 + depthFactor * 20);
                            g = Math.floor(120 + depthFactor * 60);
                            b = Math.floor(180 + depthFactor * 50);

                            // White foaming wave crests driven by SEBRA harmonic thresholds
                            let foam = Math.sin(waveParam * 3.0 + time * 2.0);
                            if (foam > 0.7 && ny < 0.15) {
                                r = 240; g = 245; b = 255;
                            }
                        } else {
                            // Wet and Dry Sand Dunes (Procedural Grain Pattern via LUT)
                            let sandNoise = SIN_LUT[Math.floor(Math.abs(nx * 600 + ny * 400) % LUT_SIZE)];
                            let shoreDist = ny - 0.3;

                            // Wet sand reflection near the shoreline
                            let wetness = Math.max(0, 1.0 - shoreDist * 6.0);

                            r = Math.floor(194 - wetness * 60 + sandNoise * 15);
                            g = Math.floor(170 - wetness * 50 + sandNoise * 12);
                            b = Math.floor(130 - wetness * 40 + sandNoise * 10);
                        }
                    }

                    data[pixelIndex]     = Math.min(255, Math.max(0, r));
                    data[pixelIndex + 1] = Math.min(255, Math.max(0, g));
                    data[pixelIndex + 2] = Math.min(255, Math.max(0, b));
                    data[pixelIndex + 3] = 255;

                    pixelIndex += 4;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            let frameEnd = performance.now();
            let duration = frameEnd - frameStart;

            if (frameEnd - lastTime >= 350) {
                document.getElementById('latency-display').textContent = duration.toFixed(2) + ' ms';
                document.getElementById('fps-display').textContent = Math.round(1000 / (duration || 1)) + ' FPS';
                lastTime = frameEnd;
            }

            requestAnimationFrame(renderBeachScene);
        }

        requestAnimationFrame(renderBeachScene);
    </script>
</body>
</html>
