<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>M4</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:monospace;font-size:10px;}
    body{background:#090D16;color:#00CCFF;padding:12px;display:flex;justify-content:center;}
    .c{width:100%;max-width:980px;display:flex;flex-direction:column;gap:8px;}
    .h{display:flex;justify-content:space-between;align-items:center;}
    .b{font-weight:bold;padding:2px 6px;border:1px solid #F05;color:#F05;background:rgba(255,0,85,.05);border-radius:4px;}
    .b.u{border-color:#0F6;color:#0F6;background:rgba(0,255,102,.05);}
    .w{width:100%;height:450px;background:#000;border:1px solid #1a2333;border-radius:4px;cursor:grab;position:relative;}
    canvas{width:100%;height:100%;display:block;}
    .p{border:1px solid #1a2333;border-radius:4px;padding:6px;background:rgba(9,13,22,.6);}
    .p.a{border-color:#00CCFF;background:rgba(0,204,255,.02);}
    .ph{display:flex;justify-content:space-between;margin-bottom:2px;color:#8ab4f8;}
    .ps{color:#F05;}.ps.v{color:#0F6;}
    .g{display:flex;gap:6px;margin-top:2px;}
    input{background:#000;border:1px solid #00CCFF;color:#0F6;padding:5px;flex-grow:1;border-radius:3px;outline:none;}
    button{background:rgba(0,204,255,.1);border:1px solid #00CCFF;color:#00CCFF;padding:5px 12px;cursor:pointer;border-radius:3px;}
    .o{margin-top:4px;color:#0F6;white-space:pre-wrap;display:none;}
    .qc{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(5,7,11,0.85);border:1px solid #141e30;padding:4px 6px;border-radius:2px;color:#00CCFF;pointer-events:none;font-size:8px;}
    .db{border:1px solid #141e30;border-radius:4px;padding:8px;background:rgba(16,27,43,.1);display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    .db div{border-left:2px solid #1A2B42;padding-left:6px;}
    .db div span{color:#526E85;text-transform:uppercase;font-size:8px;display:block;}
    .db div b{color:#0F6;font-size:11px;}
  </style>
</head>
<body>
<div class="c">
    <div class="h"><div>M4P-V6.99_LEARNING_MATRIX_SHELL</div><div class="b" id="b">ENC_LOCKED</div></div>
    <div class="w" id="wrapper"><canvas id="canvas"></canvas><div class="qc" id="qc">Ψ(t) WAITING FOR BACKEND AI...</div></div>
    <div class="p a">
        <div class="ph"><span>SYS_VAULT_GATEWAY</span><span class="ps" id="gs">Locked. Enter key.</span></div>
        <div class="g"><input type="password" id="gk"><button onclick="auth()">ENTER</button></div>
    </div>
    <div class="db">
      <div><span>Coherence Layer</span><b id="m_st">100.00%</b></div>
      <div><span>AI Stream Velocity</span><b id="m_en">0.0000 r/s</b></div>
      <div><span>Latent Dimensions</span><b>2000 SPACE</b></div>
      <div><span>Neural Mesh Sync</span><b id="m_sy">OFFLINE</b></div>
    </div>
    <div id="q"></div>
</div>
<script>
const FH="masterpassword_v4_chronos_production",D=document,G="getElementById",qEl=D[G]("q"),sEl=D[G]("gs"),bEl=D[G]("b");
["HYDRO_MATRIX","XD_OBFUSCATION"].forEach((n,i)=>qEl.innerHTML+=`<div class="p" id="q${i}"><div class="ph"><span>QTR_${i+1} // ${n}</span><span class="ps" id="s${i}">[STREAM ENCRYPTED]</span></div><div class="o" id="o${i}"></div></div>`);

async function auth(){
    const inp=D[G]("gk").value.toLowerCase().trim();sEl.innerText="[COMPUTING] Token verification...";sEl.className="ps";
    await new Promise(r=>setTimeout(r,50));
    
    // Honeypot bait handling still evaluated natively
    if(inp===FH){
       bEl.innerText="HONEYPOT_TRAP";bEl.style.borderColor="#F05";D[G]("q0").className="p";D[G]("s0").innerText="[TRAP]";
       D[G]("o0").innerText=`⚠️ HONEYPOT ENTRAPMENT LOGGED. Decoy routing activated.`;D[G]("o0").style.display="block";
       return;
    }
    
    // If a local WebSocket connection is alive, delegate credential routing to the backend
    if(ws&&ws.readyState===1){
        ws.send(JSON.stringify({type:"AUTH_TRY",key:inp}));
    }else{
        sEl.innerText="[FAILED] Backend AI connection required for authentication.";
    }
}

const cv=D[G]("canvas"),cx=cv.getContext("2d"),wrap=D[G]("wrapper"),qcBox=D[G]("qc"),stEl=D[G]("m_st"),enEl=D[G]("m_en"),syEl=D[G]("m_sy"),pts=[],M=Math,S=M.sin,C=M.cos,A=M.abs;
let w,h,rx=0,ry=0,drag=!1,sx,sy,pTime=0,mx=0,my=0,qE=0,qP=0,ws=null,aiA=!1,rdX=0,rdY=0;

function initWS(){
    ws=new WebSocket("ws://localhost:8765");
    if(syEl){ws.onopen=()=>{syEl.innerText="CONNECTED";syEl.style.color="#0F6";};ws.onclose=()=>{syEl.innerText="OFFLINE";syEl.style.color="#F05";setTimeout(initWS,2000);};}
    ws.onmessage=(e)=>{
        const d=JSON.parse(e.data);
        
        // Handle secure server-side decryption pipeline delivery
        if(d.type==="AUTH_RES"){
            if(d.success){
               bEl.innerText="ENC_UNLOCKED";bEl.className="b u";sEl.innerText="[SUCCESS] Verified.";sEl.className="ps v";
               ["q0","q1"].forEach((id,i)=>{D[G](id).className="p a";D[G](`s${i}`).innerText="[DECRYPTED]";D[G](`s${i}`).className="ps v";const el=D[G](`o${i}`);el.innerText=d.payload;el.style.display="block";});
            }else{
               sEl.innerText="[FAILED] Cryptographic match rejected.";sEl.className="ps";D[G]("gk").value="";
            }
        }
        
        // Stream spatial geometry modifications from PyTorch memory mappings
        if(d.predicted_coords&&d.predicted_coords.length===2e3){
            aiA=!0;for(let i=0;i<500;i++){pts[i].x=d.predicted_coords[i*4];pts[i].y=d.predicted_coords[i*4+1];pts[i].z=d.predicted_coords[i*4+2];pts[i].w=d.predicted_coords[i*4+3];}
        }
    };
}
setTimeout(initWS,1000);
function resize(){const dpr=window.devicePixelRatio||1;w=wrap.clientWidth;h=wrap.clientHeight;cv.width=w*dpr;cv.height=h*dpr;cx.scale(dpr,dpr);}
window.addEventListener("resize",resize);resize();
for(let i=0;i<500;i++){
    let phi=M.acos(-1+2*(i+0.5)/500),th=M.PI*(1+M.sqrt(5))*i;
    pts.push({x:S(phi)*C(th)*3.5,y:S(phi)*S(th)*3.5,z:C(phi)*3.5,w:S(th*2.5)*1.6});
}
const ptr=e=>e.touches?e.touches:e,st=(e)=>{drag=!0;const p=ptr(e);sx=p.clientX;sy=p.clientY;},mv=(e)=>{
    const p=ptr(e),r=cv.getBoundingClientRect();mx=(p.clientX-r.left)-(w/2);my=(p.clientY-r.top)-(h/2);
    if(!drag)return;rdX=p.clientX-sx;rdY=p.clientY-sy;ry+=rdX*0.006;rx+=rdY*0.006;qE+=M.sqrt(rdX*rdX+rdY*rdY)*0.025;sx=p.clientX;sy=p.clientY;
},sp=()=>drag=!1;
[["mousedown",st],["mousemove",mv],["mouseup",sp],["touchstart",st],["touchmove",mv],["touchend",sp]].forEach(([e,f])=>window.addEventListener(e,f,{passive:!e.includes("m")}));
function frame(){
    cx.clearRect(0,0,w,h);let mX=w/2,mY=h/2;if(!drag){ry+=.002;rx+=.001;rdX*=0.9;rdY*=0.9;}pTime+=0.025;qE*=0.94;qP+=0.005+(qE*0.02);
    if(ws&&ws.readyState===1){const f=[];pts.forEach(p=>f.push(p.x,p.y,p.z,p.w));ws.send(JSON.stringify({type:"TELEMETRY",state:f,action:[rdX,rdY]}));}
    let cx1=C(rx+(S(qP)*qE*0.15)),sx1=S(rx+(S(qP)*qE*0.15)),cy1=C(ry+(C(qP)*qE*0.15)),sy1=S(ry+(C(qP)*qE*0.15)),br=w*0.5*(1+S(pTime)*0.03+(qE*0.05)),cH=C(pTime*0.3+qP*0.1),sH=S(pTime*0.3+qP*0.1),proj=[];
    pts.forEach((p,idx)=>{
        let cX,cY,cZ,wf=p.w,jit=!aiA?(M.random()-0.5)*qE*0.03:0;
        if(!aiA){
            let xr=(p.x+jit)*cH-p.w*sH;wf=(p.x+jit)*sH+p.w*cH;cX=xr*br;cY=(p.y+jit)*br;cZ=(p.z+jit)*br;
            let dX=cX-mx,dY=cY-my,mD=M.hypot(dX,dY);if(mD<120){let psh=(1-(mD/120))*(6+qE);cX+=dX/mD*psh;cY+=dY/mD*psh;}
        }else{cX=p.x*br;cY=p.y*br;cZ=p.z*br;}
        proj.push({x:mX+(cX*cy1+(cY*sx1+cZ*cx1)*sy1)/(4.8-(wf*0.18))*(100/(100+(-cX*sy1+(cY*sx1+cZ*cx1)*cy1))),y:mY+(cY*cx1-cZ*sx1)*100/(100+(-cX*sy1+(cY*sx1+cZ*cx1)*cy1)),z:-cX*sy1+(cY*sx1+cZ*cx1)*cy1,w:wf,t:idx%2});
    });
    let fc=0;cx.lineWidth=0.45;
    for(let i=0;i<proj.length&&fc<1200;i++){
        for(let j=i+1;j<proj.length&&fc<1200;j++){
            if(M.hypot(proj[i].x-proj[j].x,proj[i].y-proj[j].y)<60){
                cx.strokeStyle=`rgba(${proj[i].t===0?'0,204,255':'255,0,85'},${(proj[i].t===0?0.16:0.12)+A(proj[i].w)*(proj[i].t===0?0.12:0.08)})`;cx.beginPath();cx.moveTo(proj[i].x,proj[i].y);cx.lineTo(proj[j].x,proj[j].y);cx.stroke();fc++;
            }
        }
    }
    proj.forEach(p=>{cx.beginPath();cx.fillStyle=p.z>0?"#00CCFF":"#ff0055";cx.arc(p.x,p.y,p.z>0?2.2:1.2,0,2*M.PI);cx.fill();});
    let dCoh=(M.max(0.01,1.0-(qE*0.012))*99.45).toFixed(2);
    if(stEl)stEl.innerText=dCoh+"%";if(enEl)enEl.innerText=(0.004+(qE*0.14)).toFixed(4)+" r/s";
    if(qcBox)qcBox.innerText=aiA?`Ψ(t) SYSTEM CONTROLLED BY PYTORCH IMAGINATION` : `Ψ(t) = √(${dCoh}%)|0⟩ // ΔE: ${(qE*6.626).toFixed(3)} eV`;
    requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
