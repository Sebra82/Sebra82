ass="dbm"><div class="dbl">Tensor Field Overpressure Strain</div><div class="dbv" id="m_st">0.00%</div></div><div class="dbm a"><div class="dbl">Manifold Divergence Angle</div><div class="dbv" id="m_en">0.0000 rad</div></div><div class="dbm"><div class="dbl">Interlinked 4D Clusters</div><div class="dbv">100 PYRAMID_NEXUS_GROUPS</div></div><div class="dbm a"><div class="dbl">Saturated Vertex Nodes</div><div class="dbv">500 (CLOSED_HYPER_MESH)</div></div></div><div id="q"></div></div><script>

async function processKey(nInp){try{const te=new TextEncoder();let cb=te.encode(nInp),lim=_L100*_L10;for(let i=0;i<lim;i++)cb=new Uint8Array(await crypto.subtle.digest('SHA-256',cb));const fh=await crypto.subtle.digest('SHA-256',te.encode(nInp)),hex=Array.from(new Uint8Array(fh)).map(b=>b.toString(_L10+_L3+_L3).padStart(_L2,'0')).join('');if(hex===TARGET){let res="";for(let j=0;j<M.length;j++)res+=String.fromCharCode(M[j]);const split=res.split(String.fromCharCode(37)+String.fromCharCode(37));document.getElementById("b").innerText="DECRYPTED";document.getElementById("b").className="b u";for(let i=0;i<split.length&&i<NM.length;i++){const container=document.getElementById(`q${i}`);container.style.display="block";container.className="p a";const el=document.getElementById(`o${i}`);el.innerHTML=`<strong>EXTRACTED DATA ACTUALS:</strong>\n&raquo; TARGET ID : ${split[i].toUpperCase().trim()}\n&raquo; ANCHOR    : GRISTON GEODETIC LOCK [52.565° N, 0.835° E]\n&raquo; METRICS   : CONTINUITY RE-INJECTION ACTIVATED\n&raquo; REGIME    : 100% DTSA PROTECTION APCLAIMED`;el.style.display="block";}}}}catch(e){}}

const c=document.getElementById("cv"),cx=c.getContext("2d"),wr=document.getElementById("wr");let w,h,rx=0,ry=0,drag=!1,sx,sy,pTime=0,activeTouches=[],initialPinchDist=0,baseScaleModifier=_L1;

function tick(){pTime+=0.01;cx.fillStyle="#05070B";cx.fillRect(0,0,w,h);let cx1=Math.cos(rx),sx1=Math.sin(rx),cy1=Math.cos(ry),sy1=Math.sin(ry),ox=w/_L2,oy=h/_L2,br=baseScaleModifier*(_L1+Math.sin(pTime)*0.06)*_L10,cosW=Math.cos(pTime),sinW=Math.sin(pTime),projected=[];vertices.forEach((v,idx)=>{let x=v.x,y=v.y,z=v.z,w4=v.w;if(idx%_L2===0){x*=0.999;y*=0.999;}let x_rot=x*cosW-w4*sinW,w_rot1=x*sinW+w4*cosW,z_rot=z*cosW-w_rot1*sinW,w_final=z*sinW+w_rot1*cosW;activeTouches.forEach(t=>{let dx=(x_rot*br+ox)-t.x,dy=(y*br+oy)-t.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<_L100){let fo=(_L100-dist)/_L100*_L10;x_rot+=(dx/dist)*(fo/_L30);y+=(dy/dist)*(fo/_L30);}});let distance4D=4.2,factor3D=1/(distance4D-w_final),x3d=x_rot*factor3D*br,y3d=y*factor3D*br,z3d=z_rot*factor3D*br,x1=x3d*cy1-z3d*sy1,z1=x3d*sy1+z3d*cy1,y2=y3d*cx1-z1*sx1,z2=y3d*sx1+z1*cx1,sz=_L100/(_L100+z2),px=ox+x1*sz*_L3,py=oy+y2*sz*_L3;projected.push({x:px,y:py,vis:(px>=0&&px<=w&&py>=0&&py<=h),w:w_final,cId:v.cId});});cx.lineWidth=0.4;for(let cIdx=0;cIdx<clusterCount;cIdx++){let start=cIdx*nodesPerCluster;for(let i=0;i<nodesPerCluster;i++){for(let j=i+_L1;j<nodesPerCluster;j++){let p1=projected[start+i],p2=projected[start+j];if(p1.vis&&p2.vis){cx.strokeStyle=`rgba(${Math.floor(100+p1.w*40)},255,${Math.floor(200+p2.w*40)},${0.14+Math.abs(p1.w)*0.1})`;cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.stroke();}}}if(cIdx<clusterCount-_L1){let pNext1=projected[start],pNext2=projected[start+nodesPerCluster];if(pNext1.vis&&pNext2.vis){cx.strokeStyle="rgba(255,0,85,0.06)";cx.beginPath();cx.moveTo(pNext1.x,pNext1.y);cx.lineTo(pNext2.x,pNext2.y);cx.stroke();}}}projected.forEach((p,idx)=>{if(!p.vis)return;cx.fillStyle=idx%_L5===0?"#FF0055":"#00FFCC";cx.fillRect(p.x-1,p.y-1,2,2);});let activeStrain=Math.min(Math.abs(Math.sin(pTime)*(_L10*_L5)+(Math.abs(rx)+Math.abs(ry))*_L5),99.45);document.getElementById("m_st").innerText=activeStrain.toFixed(2)+"%";document.getElementById("m_en").innerText=Math.abs(Math.sin(pTime)).toFixed(4)+" rad";requestAnimationFrame(tick);}
function gtp(e){let r=c.getBoundingClientRect();return Array.from(e.touches).map(t=>({x:t.clientX-r.left,y:t.clientY-r.top}));}wr.addEventListener("touchstart",e=>{e.preventDefault();activeTouches=gtp(e);drag=!0;if(e.touches.length===_L1){sx=e.touches.clientX;sy=e.touches.clientY;}else if(e.touches.length===_L2){let dx=e.touches.clientX-e.touches.clientX,dy=e.touches.clientY-e.touches.clientY;initialPinchDist=Math.sqrt(dx*dx+dy*dy);}},{passive:false});wr.addEventListener("touchmove",e=>{e.preventDefault();activeTouches=gtp(e);if(!drag)return;if(e.touches.length===_L1){rx+=(e.touches.clientY-sy)*0.008;ry+=(e.touches.clientX-sx)*0.008;sx=e.touches.clientX;sy=e.touches.clientY;}else if(e.touches.length===_L2){let dx=e.touches.clientX-e.touches.clientX,dy=e.touches.clientY-e.touches.clientY,d=Math.sqrt(dx*dx+dy*dy);if(initialPinchDist>0){baseScaleModifier=Math.max(0.3,Math.min((d/initialPinchDist)*baseScaleModifier,3.0));initialPinchDist=d;}}},{passive:false});wr.addEventListener("touchend",e=>{e.preventDefault();activeTouches=gtp(e);if(e.touches.length===0){drag=!1;initialPinchDist=0;}},{passive:false});wr.addEventListener("mousedown",e=>{drag=!0;sx=e.clientX;sy=e.clientY;activeTouches=[{x:e.clientX-c.getBoundingClientRect().left,y:e.clientY-c.getBoundingClientRect().top}];});window.addEventListener("mouseup",()=>{drag=!1;activeTouches=[];});window.addEventListener("mousemove",e=>{let r=c.getBoundingClientRect();if(!drag){activeTouches=[];return;}activeTouches=[{x:e.clientX-r.left,y:e.clientY-r.top}];rx+=(e.clientY-sy)*0.008;ry+=(e.clientX-sx)*0.008;sx=e.clientX;sy=e.clientY;});tick();
