<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>M4</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#060913;color:#c9d1d9;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;overflow:hidden}.box{width:100%;max-width:1100px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #21262d;padding-bottom:8px}.title{font-size:13px;font-weight:700;color:#00ccff;font-family:monospace}.badge{font-size:10px;font-weight:bold;color:#ff3366;background:rgba(255,51,102,0.08);padding:3px 8px;border-radius:12px;border:1px solid rgba(255,51,102,0.2);font-family:monospace}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media(max-width:768px){.layout{grid-template-columns:1fr}}.vp{border:1px solid #30363d;background:#03050a;border-radius:6px;position:relative;height:320px;touch-action:none;cursor:grab}canvas{position:absolute;width:100%;height:100%;display:block}.side{display:flex;flex-direction:column;gap:8px;height:320px;overflow-y:auto}.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;cursor:pointer;transition:background 0.2s,border-color 0.2s}.card:hover{background:#1f242c}.active-card{border-color:#00ccff!important;background:#1c2735!important}.lbl{font-size:9px;font-weight:700;color:#8b949e;text-transform:uppercase;border-bottom:1px solid #21262d;padding-bottom:2px;margin-bottom:4px;font-family:monospace}.txt{font-family:monospace;font-size:11px;color:#ff3366;word-break:break-all}.gate{display:flex;background:#161b22;border:1px solid #30363d;padding:8px;border-radius:6px;gap:8px}input{flex:1;background:#070a10;border:1px solid #30363d;color:#00ccff;padding:6px 10px;font-family:monospace;font-size:12px;outline:none;border-radius:4px}button{background:#238636;border:none;color:#fff;padding:6px 16px;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer}.term{background:#03050a;border:1px solid #30363d;border-radius:6px;padding:10px;font-family:monospace;font-size:11px;color:#ff3366;min-height:70px;max-height:100px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}.ok-glow{border-color:#2ea043!important;box-shadow:0 0 15px rgba(46,160,67,0.15)}.ok-text{color:#56d364!important}.ok-badge{color:#56d364!important;background:rgba(46,160,67,0.08)!important;border-color:rgba(46,160,67,0.2)!important}</style></head><body><div class="box" id="wb"><div class="hdr"><div class="title" id="t1">...</div><div class="badge" id="bg">...</div></div><div class="layout"><div class="vp"><canvas id="cv"></canvas></div><div class="side"><div class="card" id="c1" onclick="sel(0)"><div class="lbl" id="l1">...</div><div class="txt" id="d1">...</div></div><div class="card" id="c2" onclick="sel(1)"><div class="lbl" id="l2">...</div><div class="txt" id="d2">...</div></div><div class="card" id="c3" onclick="sel(2)"><div class="lbl" id="l3">...</div><div class="txt" id="d3">...</div></div><div class="card" id="c4" onclick="sel(3)"><div class="lbl" id="l4">...</div><div class="txt" id="d4">...</div></div></div></div><div class="gate"><input type="password" id="key" placeholder="..." autocomplete="off"><button onclick="unlock()">►</button></div><div class="term" id="tm">...</div></div><script>const V={s_t:"TTRQLVY2Ljk5X0NPTVBMRVhfQU5JTUFURURfTUFUUklY",s_c:"c3lzLnNlY3VyaXR5X2NoYWxsZW5nZShBVVRIRU5USUNBVElPTl9UUklHR0VSKTogSHlwZXItZGVmaW5pdGlvbiA1MDAtdmVydGV4IGtpbmVtYXRpYyBjb3JlIGxvY2tlZC4gRW50ZXIgY3JlZGVudGlhbHMga2V5IHN0cmluZyB0byByZWxlYXNlIHRlbGVtZXRyeS4=",s_b:"U1lTVEVNX0xPQ0tFRA==",s_l:["UVRSXzEgLy8gSFlEUk9fTUFUUklY","UVRSXzIgLy8gWERfT0JGVVNDQVRJT04=","UVRSXzMgLy8gRFlOQU1JQ19DQU5WQVM=","UVRSXzQgLy8gU0VDVVJJVFlfU0VBTA=="],s_v:["W1JFU1RSSUNURURdIEhpZ2gtZW50cm9weSBkYX const pts=[];let sIdx=0;for(let i=0;i<500;i++){let t=2*Math.PI*i/1.61803398875,p=Math.acos(1-2*(i+0.5)/500);pts.push({x:Math.cos(t)*Math.sin(p)*1.8,y:Math.sin(t)*Math.sin(p)*1.8,z:Math.cos(p)*1.8,oX:Math.cos(t)*Math.sin(p)*1.8,oY:Math.sin(t)*Math.sin(p)*1.8,oZ:Math.cos(p)*1.8,p:t,m:1+0.3*Math.sin(t*3),g:i%4})}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let ok=false,zoom=1.0,rx=0.003,ry=0.005,mx=0,my=0,drag=false,px=0,py=0,f=0;
function res(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight}window.addEventListener('resize',res);res();
function ptr(e){return e.targetTouches&&e.targetTouches.length>0?{x:e.targetTouches.clientX,y:e.targetTouches.clientY}:{x:e.clientX,y:e.clientY}}
function start(e){drag=true;const p=ptr(e);px=p.x;py=p.y}
function move(e){if(!drag)return;const p=ptr(e);my+=(p.x-px)*0.008;mx+=(p.y-py)*0.008;px=p.x;py=p.y}
function end(){drag=false}
cv.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);cv.addEventListener('touchstart',start,{passive:true});cv.addEventListener('touchmove',move,{passive:true});cv.addEventListener('touchend',end);
function sel(idx){sIdx=idx;for(let i=1;i<=4;i++){document.getElementById('c'+i).classList.remove('active-card')}document.getElementById('c'+(idx+1)).classList.add('active-card')}sel(0);
function loop(){
    f+=0.02;ctx.clearRect(0,0,cv.width,cv.height);const cx=cv.width/2,cy=cv.height/2,scale=Math.min(cx,cy)*0.28*zoom,ax=rx+mx,ay=ry+my;
    if(!drag){mx*=0.95;my*=0.96}rx+=0.001;ry+=0.002;
    pts.forEach(p=>{let d=Math.sin(p.p+f)*0.15*p.m;p.x=p.oX*(1+d);p.y=p.oY*(1+d);p.z=p.oZ*(1+d)});
    const proj=pts.map(p=>{let y1=p.y*Math.cos(ax)-p.z*Math.sin(ax),z1=p.y*Math.sin(ax)+p.z*Math.cos(ax),x2=p.x*Math.cos(ay)+z1*Math.sin(ay);return{x:cx+x2*scale,y:cy+y1*scale,z:-p.x*Math.sin(ay)+z1*Math.cos(ay)}});
    for(let i=0;i<proj.length;i++){for(let j=i+1;j<proj.length;j++){let d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y,pts[i].z-pts[j].z);if(d<0.45){let isA=(pts[i].g===sIdx||pts[j].g===sIdx);ctx.beginPath();ctx.moveTo(proj[i].x,proj[i].y);ctx.lineTo(proj[j].x,proj[j].y);if(isA){ctx.strokeStyle=`rgba(0,204,255,${0.6-d*0.5})`}else{ctx.strokeStyle=ok?`rgba(86,211,100,${0.2-d*0.2})`:`rgba(255,51,102,${0.15-d*0.15})`}ctx.stroke()}}}
    proj.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,pts[i].g===sIdx?3.5:1.5,0,2*Math.PI);ctx.fillStyle=pts[i].g===sIdx?'#00ccff':(ok?'#56d364':'#ff3366');ctx.fill()});
    requestAnimationFrame(loop)
}requestAnimationFrame(loop);
function unlock(){
    if(document.getElementById('key').value.trim()==="CHRONOS_ALPHA_99"){

        document.getElementById('d1').innerHTML=atob(V.p1);document.getElementById('d2').innerHTML=atob(V.p2);document.getElementById('d3').innerHTML=atob(V.p3);document.getElementById('d4').innerHTML=atob(V.p4);document.getElementById('tm').innerText=atob(V.g_o);document.getElementById('tm').style.color="#56d364";
        for(let i=1;i<=4;i++)document.getElementById('d'+i).className="txt ok-text"
    }else{alert("ACCESS DENIED.")}
