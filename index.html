<!-- Proposed Structure -->
<div class="dashboard-grid">
  <!-- Main Visualization (Large) -->
  <div class="card wide">
    <div class="header">
      <h3>Real-Time Waveform Analysis</h3>
      <div class="live-indicator">● LIVE</div>
    </div>
    <canvas id="mainChart"></canvas>
  </div>

  <!-- Key Metrics (Immediate Value) -->
  <div class="metrics-bar">
    <div class="kpi"><span>Latency</span><strong>0.038ms</strong><small>GPU Accelerated</small></div>
    <div class="kpi"><span>Fidelity</span><strong class="text-green">99.9%</strong><small>Stable</small></div>
    <div class="kpi"><span>Throughput</span><strong>26.3 GT/s</strong><small>Max Load</small></div>
  </div>

  <!-- Focused Controls (Bottom) -->
  <div class="card controls">
    <label>Simulation Parameters</label>
    <div class="control-row">
      <!-- Input groups with clear labels and current values -->
    </div>
  </div>
</div>
