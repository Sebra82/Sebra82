<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuantEngine v15.0 - Complete Mobile-Adaptive Grid</title>
  <style>
    :root {
      --bg-deep: #020408;
      --card-bg: rgba(7, 11, 19, 0.96);
      --border-color: rgba(30, 42, 64, 0.85);
      --neon-cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.35);
      --warning-amber: #f0883e;
      --crimson-red: #ff3344;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-green: #7ee787;
      --accent-purple: #c084fc;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Keep body fixed to prevent iOS scroll bounce */
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
    }

    #backgroundModelCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .platform-container {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.8rem;
      max-width: 1850px;
      width: 98vw;
      height: 98vh;
      box-shadow: 0 45px 110px rgba(0, 0, 0, 0.99);
      backdrop-filter: blur(22px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden; /* Contain layout */
    }

    /* Authentication Portal Overlay */
    #vaultLockoutOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 4, 8, 0.99);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      padding: 1.5rem;
      text-align: center;
    }
    #vaultLockoutOverlay.hidden { display: none; }

    .lockout-title { font-size: 1.2rem; font-weight: 600; color: var(--text-main); letter-spacing: 0.5px; }
    .lockout-msg { font-size: 0.8rem; color: var(--text-muted); max-width: 500px; line-height: 1.4; background: #04060a; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-family: var(--font-mono); }
    .unlock-input { background: #04060a; border: 1px solid var(--border-color); color: var(--neon-cyan); padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; width: 90%; max-width: 320px; text-align: center; outline: none; font-family: var(--font-mono); }
    .unlock-btn { background: var(--neon-cyan); color: #020408; border: none; padding: 0.7rem 1.4rem; border-radius: 6px; font-weight: 600; cursor: pointer; box-shadow: 0 0 15px var(--cyan-glow); font-size: 0.9rem; }
    .unlock-btn:hover { background: #7dd3fc; }
    .auth-error { font-size: 0.75rem; color: var(--crimson-red); min-height: 16px; font-family: var(--font-mono); }

    /* Header */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.4rem;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 4px;
    }
    .brand-title { display: flex; align-items: center; gap: 8px; font-size: 1.0rem; font-weight: 600; color: #fff; }
    .brand-title span { color: var(--neon-cyan); font-weight: 700; }
    .status-badges { display: flex; gap: 6px; align-items: center; }
    .compliance-badge { font-size: 0.6rem; background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); padding: 2px 6px; border-radius: 8px; border: 1px solid rgba(0, 243, 255, 0.3); font-family: var(--font-mono); font-weight: 600; }
    .security-badge { font-size: 0.6rem; background: rgba(192, 132, 252, 0.15); color: var(--accent-purple); padding: 3px 6px; border-radius: 10px; border: 1px solid rgba(192, 132, 252, 0.4); font-weight: 600; font-family: var(--font-mono); }
    .node-badge { font-size: 0.6rem; background: rgba(30, 42, 64, 0.6); color: var(--accent-green); padding: 2px 6px; border-radius: 8px; border: 1px solid var(--border-color); font-family: var(--font-mono); }

    /* Responsive Grid Layout */
    .platform-grid {
      display: grid;
      grid-template-columns: 1fr 2.5fr 1fr;
      gap: 0.6rem;
      flex: 1;
      overflow: hidden;
    }

    .column { display: flex; flex-direction: column; gap: 0.6rem; overflow-y: auto; padding-right: 2px; }
    
    .panel-card { background: rgba(3, 7, 15, 0.96); border-radius: 8px; border: 1px solid var(--border-color); padding: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; box-shadow: 0 8px 25px rgba(0,0,0,0.6); flex-shrink: 0; }
    .panel-title { font-size: 0.65rem; font-weight: 700; color: var(--neon-cyan); display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; text-transform: uppercase; }

    /* Viewports */
    .canvas-box { position: relative; width: 100%; height: 110px; background: #000; border-radius: 5px; border: 1px solid rgba(0, 243, 255, 0.3); overflow: hidden; flex-shrink: 0; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .hud-tag { position: absolute; top: 3px; left: 5px; background: rgba(2, 4, 8, 0.9); border: 1px solid var(--border-color); padding: 1px 4px; border-radius: 3px; font-size: 0.55rem; color: var(--text-muted); font-family: var(--font-mono); z-index: 2; pointer-events: none; }
    .hud-tag span { color: var(--neon-cyan); font-weight: 600; }

    /* Center Quantum Model Viewport (Overlays Planet Background) */
    .quantum-viewport-box { position: relative; width: 100%; height: 100%; background: transparent; border-radius: 8px; overflow: hidden; grid-column: 1 / -1; grid-row: 2 / 3; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
    #quantumModelCanvas { z-index: 5; cursor: grab; position: absolute; top:0; left:0; width:100%; height:100%; }
    #quantumModelCanvas:active { cursor: grabbing; }

    /* Controls Grid */
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .control-item { background: rgba(10, 14, 22, 0.85); border: 1px solid var(--border-color); padding: 3px 5px; border-radius: 4px; display: flex; flex-direction: column; gap: 2px; }
    .control-label { font-size: 0.58rem; color: var(--text-muted); display: flex; justify-content: space-between; font-weight: 500; }
    .control-label span { color: var(--text-main); font-weight: 600; font-family: var(--font-mono); }
    input[type="range"], select { width: 100%; accent-color: var(--neon-cyan); background: #1e2a40; color: #fff; border: 1px solid var(--border-color); height: 4px; border-radius: 2px; outline: none; }
    select { height: 22px; font-size: 0.6rem; padding: 0 4px; font-family: var(--font-mono); }

    /* Terminals & Dumps */
    .data-dump { background: #010409; border: 1px solid var(--border-color); border-radius: 5px; padding: 5px; font-size: 0.58rem; color: var(--accent-green); height: 65px; overflow-y: auto; font-family: var(--font-mono); line-height: 1.2; }
    .math-screen { background: #010409; border: 1px solid var(--border-color); border-radius: 5px; padding: 5px; font-size: 0.6rem; color: var(--accent-green); height: 75px; overflow-y: auto; font-family: var(--font-mono); line-height: 1.25; }

    /* Buttons */
    .btn-row { display: flex; gap: 4px; }
    .action-btn { width: 100%; padding: 0.35rem; font-weight: 600; font-size: 0.65rem; color: #020408; background: var(--neon-cyan); border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; text-align: center; }
    .action-btn:hover { box-shadow: 0 0 12px var(--cyan-glow); background: #3dd9e8; }
    .btn-secondary { background: #1e2a40; color: var(--text-main); border: 1px solid var(--border-color); font-weight: 500; }
    .btn-secondary:hover { background: #2c3e5a; }

    .calc-row { display: flex; justify-content: space-between; font-size: 0.65rem; padding: 4px 6px; background: rgba(10, 14, 22, 0.85); border-radius: 4px; border: 1px solid var(--border-color); color: var(--text-muted); }
    .calc-row strong { color: var(--neon-cyan); font-family: var(--font-mono); }

    /* --- MEDIA QUERIES FOR MOBILE ADAPTIVE GRID --- */

    /* LAPTOP LANDSCAPE (Default Grid) */
    @media (min-width: 1280px) {
      .quantum-viewport-box { grid-column: 2 / 3; grid-row: 1 / -1; }
    }

    /* TABLET / MOBILE LANDSCAPE (Compress columns) */
    @media (max-width: 1279px) and (min-width: 768px) {
      .platform-grid { grid-template-columns: 1fr 1.6fr 1fr; }
      .quantum-viewport-box { grid-column: 2 / 3; grid-row: 1 / -1; height: 100%; }
    }

    /* MOBILE PORTRAIT (Vertical Stack) */
    @media (max-width: 767px) {
      body { overflow-y: auto; } /* Allow body scroll if content overflows */
      .platform-container { height: auto; min-height: 98vh; overflow: visible; }
      .widget-header { flex-wrap: wrap; gap: 5px; }
      .platform-grid { grid-template-columns: 1fr; overflow-y: visible; gap: 0.5rem; }
      
      .column { grid-row: auto; overflow-y: visible; }
      .quantum-viewport-box { grid-column: 1; grid-row: 2; height: 220px; margin: 5px 0; }
      
      .data-dump, .math-screen { height: 80px; }
    }
  </style>
</head>
<body>

<!-- Background Planet Model (Remains static in background layer) -->
<canvas id="backgroundModelCanvas"></canvas>

<div class="platform-container">
  <!-- Authentication Portal Overlay -->
  <div id="vaultLockoutOverlay">
    <div class="lockout-title">🔐 Enterprise Elite Gateway</div>
    <div class="lockout-msg">
      Enter master authorization key (`Quantum`) to mount QuantEngine v15.0.<br>
      <i>Node: UK-CENTRAL-0
